<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-app-demo - SDD Spec tree</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f3; --text:#1a1e24; --muted:#5b6470;
  --border:#d9dde3; --accent:#4f46e5; --doc:#64748b; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tint:14%; --label-w:200px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161a21; --surface2:#1d222b; --text:#e5e8ed; --muted:#9aa3af;
    --border:#2a303a; --accent:#8b8cf8; --doc:#94a3b8; --shadow:0 1px 2px rgba(0,0,0,.4); --tint:22%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface2:#1d222b; --text:#e5e8ed; --muted:#9aa3af;
  --border:#2a303a; --accent:#8b8cf8; --doc:#94a3b8; --shadow:0 1px 2px rgba(0,0,0,.4); --tint:22%;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);overflow-x:hidden}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.92em;background:var(--surface2);padding:0 .3em;border-radius:4px}
a{color:var(--accent)}
.muted{color:var(--muted)}
/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-in{max-width:1680px;margin:0 auto;padding:12px 16px 0}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
.projchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px 3px 6px;cursor:pointer;font-size:12.5px}
.pchip input{margin:0;accent-color:var(--accent)}
.pchip .ref{font-family:var(--mono);color:var(--muted);font-size:11.5px}
.pchip .dirty{color:var(--st-Partial);font-size:11.5px}
.spacer{flex:1}
.search{min-width:180px;flex:0 1 280px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 9px;cursor:pointer}
.row2{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:10px}
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);padding-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;background:var(--c);display:inline-block}
main{max-width:1680px;margin:0 auto;padding:16px}
.gen{font-size:12px;color:var(--muted);margin:0 0 12px}
/* loop */
.loop{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.loop h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.loop ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.loop li{min-width:0;overflow-wrap:anywhere;position:relative;background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:12.5px}
.loop li b{display:block;font-size:13px}
.loop li span{color:var(--muted)}
/* flow grid */
.flow-wrap{position:relative}
.flow{display:grid;grid-template-columns:var(--label-w) repeat(var(--cols),minmax(0,1fr));gap:10px 14px;align-items:start}
.fl-head{position:sticky;top:var(--hdr,96px);z-index:5;background:var(--bg);padding:6px 0;font-weight:700;font-size:15px;border-bottom:2px solid var(--border)}
.fl-head small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.fl-label{position:relative;display:flex;gap:10px;padding-top:6px}
.fl-label .step{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
.fl-label b{display:block;font-size:14px}
.fl-label small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.fl-label:not(.last)::after{content:"";position:absolute;left:13px;top:38px;bottom:-14px;border-left:2px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.fl-cell{min-width:0;padding:4px 0 12px;border-bottom:1px dashed var(--border)}
.fl-cell .empty{color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px}
.tiles.docs{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tiles.adr{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tiles.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
/* tiles */
.tile{--c:var(--doc);display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;cursor:pointer;
  background:color-mix(in srgb,var(--c) var(--tint),var(--surface));
  border:1px solid color-mix(in srgb,var(--c) 40%,var(--border));border-left:4px solid var(--c);
  border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,opacity .12s}
.tile:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.08)}
.tile:focus-visible,.group-head:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile.doc{background:var(--surface)}
.tile.doc.adr{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.t-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:0}
.num{white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:13px;color:color-mix(in srgb,var(--c) 70%,var(--text))}
.t-title{font-weight:600;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11.5px;color:var(--muted)}
.t-meta b{color:var(--text);font-weight:600}
.t-badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:10.5px;border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.badge.gap{border-color:color-mix(in srgb,var(--st-Gap) 60%,var(--border));color:var(--st-Gap)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--text));white-space:nowrap}
.chip i{font-style:normal}
.adr-st{font-size:10.5px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%;background:var(--c)}
.tile.sm{padding:6px 8px;gap:2px}
.tile.sm .t-title{font-size:12px;font-weight:500}
.tile.dim,.row.dim{opacity:.28}
.tile.hit{box-shadow:0 0 0 2px var(--accent)}
.tile.sel,.group-head.sel{box-shadow:0 0 0 3px var(--accent)}
.tile.linked{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
/* groups */
.group{margin-top:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.group-head{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer}
.gh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gh-top b{font-size:14px}
.caret{display:inline-block;transition:transform .15s;color:var(--muted)}
.open>.group-head .caret{transform:rotate(90deg)}
.waffle{display:flex;flex-wrap:wrap;gap:2px}
.waffle i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.group-body{padding:0 12px 12px}
.area{margin-top:10px}
.area-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.area-h .bar{flex:0 0 80px}
.hits{font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px}
/* delivery */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tile.dlv{--c:var(--accent);background:var(--surface)}
.big{font-size:20px;font-weight:700;font-family:var(--mono)}
/* svg overlays */
svg.overlay{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:3}
svg.overlay.flowx{z-index:0}
.flow{position:relative;z-index:1}
.flow .tile,.flow .group{position:relative;z-index:1}
svg.overlay path{fill:none;pointer-events:stroke}
.xl{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:7 4;opacity:.9}
.xl:hover{opacity:1;stroke-width:3}
/* components */
.cbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.cbar label{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.cvb + .cvb{margin-top:28px;padding-top:12px;border-top:2px solid var(--border)}
.cv{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,180px) minmax(0,1fr);align-items:start}
.cv-col{min-width:0;display:flex;flex-direction:column;gap:2px;position:relative;z-index:4}
.cv-ph{font-weight:700;margin:12px 0 4px;font-size:14px}
.cv-ph:first-child{margin-top:0}
.cv-lh{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 2px;cursor:pointer;border:0;background:none;padding:2px 0;text-align:left}
.row{--c:var(--doc);display:flex;align-items:center;gap:6px;min-width:0;padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:12.5px;min-height:26px}
.row .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.row .p span{color:var(--muted)}
.row .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
.row .k{font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;background:var(--surface2);color:var(--muted)}
.row .k.test{background:color-mix(in srgb,var(--st-Implemented) 20%,var(--surface));color:var(--st-Implemented)}
.row.specnode{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.hl{box-shadow:0 0 0 2px var(--accent)}
.row.fade{opacity:.35}
.el{stroke-width:1.4;opacity:.28}
.el.on{opacity:.95;stroke-width:2.4}
.el.off{opacity:.06}
.matrix-wrap{overflow:auto;max-height:78vh;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table.mx{border-collapse:separate;border-spacing:0;font-size:11.5px}
table.mx th,table.mx td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:0;text-align:center}
table.mx thead th{position:sticky;top:0;background:var(--surface);z-index:2;height:120px;vertical-align:bottom}
table.mx thead th div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:6px 3px;max-height:116px;overflow:hidden;text-overflow:ellipsis}
table.mx th.rh{position:sticky;left:0;background:var(--surface);text-align:left;padding:2px 8px;font-family:var(--mono);font-weight:400;white-space:nowrap;z-index:1;max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.mx thead th.rh{z-index:3}
table.mx td{width:24px;min-width:24px;height:22px;cursor:pointer}
table.mx td.v{background:color-mix(in srgb,var(--c) var(--a),transparent);font-weight:600}
/* status */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-bottom:12px}
.kpi{--c:var(--doc);border-radius:8px;padding:8px;background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border-left:4px solid var(--c)}
.kpi b{display:block;font-size:20px;font-family:var(--mono)}
.kpi span{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
h2.sec{font-size:15px;margin:22px 0 8px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2)}
table.t tr:last-child td{border-bottom:0}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left}
.ids{display:flex;flex-wrap:wrap;gap:4px}
.idc{--c:var(--doc);font-family:var(--mono);font-size:11px;border-radius:4px;padding:0 5px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--border))}
details.diag{margin-top:18px}
details.diag summary{cursor:pointer;color:var(--muted)}
/* panel */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(100%,480px);z-index:40;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s}
#panel.open{transform:none}
.pn-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--border)}
.pn-head .x{margin-left:auto;border:1px solid var(--border);background:var(--surface);border-radius:8px;width:30px;height:30px;cursor:pointer;flex:none}
.pn-title{min-width:0}
.pn-title small{display:block;color:var(--muted);font-size:12px}
.pn-title h2{margin:2px 0 4px;font-size:17px;line-height:1.25}
.pn-body{overflow:auto;padding:4px 16px 24px}
.pn-body h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a,.links button{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:2px 8px;text-decoration:none;background:var(--surface2);color:var(--text);cursor:pointer}
ul.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.reqs li{--c:var(--doc);border-left:3px solid var(--c);padding:4px 0 4px 8px;font-size:13px}
ul.reqs .rt{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
ul.reqs .sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px}
.ev{font-size:10.5px;font-weight:700;color:var(--st-Implemented)}
.noev{font-size:10.5px;color:var(--muted)}
ul.tasks{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
ul.tasks li{display:flex;gap:6px}
ul.tasks .cb{flex:none;font-family:var(--mono)}
ul.plain{margin:0;padding-left:18px;font-size:13px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:35;display:none}
.backdrop.on{display:block}
@media (max-width:900px){ svg.overlay.flowx{display:none} }
@media (max-width:760px){
  .flow{display:block}
  .fl-head{display:none}
  .fl-label{margin-top:14px}
  .fl-label::after{display:none}
  .fl-cell{padding-top:6px}
  .fl-cell[data-proj]::before{content:attr(data-proj);display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .cv{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr)}
  .tiles,.tiles.docs,.tiles.adr{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .search{flex:1 1 100%;min-width:0}
  .pchip{max-width:100%;flex-wrap:wrap}
  .loop ol{grid-template-columns:minmax(0,1fr)}
  .gen{overflow-wrap:anywhere}
}

/* ===================== Glass design (data-design="glass") ===================== */
:root[data-design="glass"]{
  --bg:#060912; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08); --text:#e9edf6; --muted:#97a3bb;
  --border:rgba(255,255,255,.11); --accent:#8aa2ff; --accent2:#5eead4; --doc:#93a6cc;
  --shadow:0 10px 34px rgba(0,0,0,.38); --hi:inset 0 1px 0 rgba(255,255,255,.07); --tint:12%;
  --blur:blur(18px) saturate(160%); --glow:.55; --panel:rgba(14,19,33,.62);
  --aurora1:rgba(99,102,241,.30); --aurora2:rgba(45,212,191,.16); --aurora3:rgba(168,85,247,.20); --gridline:rgba(255,255,255,.035);
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root[data-design="glass"]:not([data-theme="dark"]){
    --bg:#eef2fa; --surface:rgba(255,255,255,.58); --surface2:rgba(255,255,255,.75); --text:#0d1527; --muted:#56637c;
    --border:rgba(15,23,42,.09); --accent:#4c58d6; --accent2:#0f9f8f; --doc:#64748b;
    --shadow:0 10px 30px rgba(30,41,80,.10); --hi:inset 0 1px 0 rgba(255,255,255,.85); --tint:12%;
    --glow:.25; --panel:rgba(255,255,255,.66);
    --aurora1:rgba(99,102,241,.20); --aurora2:rgba(45,212,191,.16); --aurora3:rgba(236,72,153,.10); --gridline:rgba(15,23,42,.04);
    color-scheme: light;
  }
}
:root[data-design="glass"][data-theme="light"]{
  --bg:#eef2fa; --surface:rgba(255,255,255,.58); --surface2:rgba(255,255,255,.75); --text:#0d1527; --muted:#56637c;
  --border:rgba(15,23,42,.09); --accent:#4c58d6; --accent2:#0f9f8f; --doc:#64748b;
  --shadow:0 10px 30px rgba(30,41,80,.10); --hi:inset 0 1px 0 rgba(255,255,255,.85); --tint:12%;
  --glow:.25; --panel:rgba(255,255,255,.66);
  --aurora1:rgba(99,102,241,.20); --aurora2:rgba(45,212,191,.16); --aurora3:rgba(236,72,153,.10); --gridline:rgba(15,23,42,.04);
  color-scheme: light;
}
[data-design="glass"] body{isolation:isolate;letter-spacing:.005em}
[data-design="glass"] body::before{content:"";position:fixed;inset:-15%;z-index:-2;pointer-events:none;
  background:radial-gradient(38% 32% at 12% 8%,var(--aurora1),transparent 70%),
             radial-gradient(32% 28% at 88% 12%,var(--aurora2),transparent 70%),
             radial-gradient(45% 40% at 72% 92%,var(--aurora3),transparent 70%)}
[data-design="glass"] body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 25%,transparent 80%)}
/* chrome */
[data-design="glass"] header.top{background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border);box-shadow:var(--hi)}
[data-design="glass"] h1{font-weight:650;letter-spacing:-.015em;background:linear-gradient(92deg,var(--text) 30%,var(--accent) 75%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-design="glass"] .pchip,[data-design="glass"] .iconbtn,[data-design="glass"] .search{background:var(--surface);border-color:var(--border);box-shadow:var(--hi);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
[data-design="glass"] .search,[data-design="glass"] .iconbtn{border-radius:999px}
[data-design="glass"] .iconbtn{padding:5px 12px}
[data-design="glass"] .search:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
[data-design="glass"] .tabs{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;margin-bottom:8px;box-shadow:var(--hi)}
[data-design="glass"] .tab{border:0;border-radius:999px;padding:6px 16px;font-weight:550}
[data-design="glass"] .tab[aria-selected="true"]{color:var(--text);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent) 14%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent),0 0 18px color-mix(in srgb,var(--accent) 25%,transparent)}
[data-design="glass"] .sw{border-radius:50%;box-shadow:0 0 8px color-mix(in srgb,var(--c) calc(var(--glow)*100%),transparent)}
/* panels */
[data-design="glass"] .loop,[data-design="glass"] .group,[data-design="glass"] .card,[data-design="glass"] .tbl-wrap,[data-design="glass"] .matrix-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow),var(--hi);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
[data-design="glass"] .loop h2,[data-design="glass"] .area-h,[data-design="glass"] .cv-lh{letter-spacing:.14em;font-weight:600}
[data-design="glass"] .loop li{background:linear-gradient(180deg,var(--surface2),transparent);border:1px solid var(--border);border-radius:12px}
[data-design="glass"] .loop li b{color:var(--accent)}
[data-design="glass"] table.t th{background:transparent;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
[data-design="glass"] table.mx thead th,[data-design="glass"] table.mx th.rh{background:var(--panel)}
/* flow */
[data-design="glass"] .fl-head{background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border);font-weight:600;letter-spacing:-.01em}
[data-design="glass"] .fl-label .step{background:transparent;color:var(--accent);border:1.5px solid color-mix(in srgb,var(--accent) 80%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 0 10px color-mix(in srgb,var(--accent) 25%,transparent);font-family:var(--mono)}
[data-design="glass"] .fl-label b{font-weight:600}
[data-design="glass"] .fl-label:not(.last)::after{border-left:0;width:1.5px;background:linear-gradient(var(--accent),transparent);opacity:.6;left:13px}
[data-design="glass"] .fl-cell{border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
/* tiles */
[data-design="glass"] .tile{position:relative;overflow:hidden;border-radius:14px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 3%,transparent) 60%),
             linear-gradient(var(--surface),var(--surface)),color-mix(in srgb,var(--bg) 84%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 30%,var(--border));box-shadow:var(--hi),0 6px 20px rgba(0,0,0,.18)}
[data-design="glass"] .tile::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1.5px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 14px var(--c);opacity:.9}
[data-design="glass"] .tile.doc{background:linear-gradient(var(--surface),var(--surface)),color-mix(in srgb,var(--bg) 84%,transparent)}
[data-design="glass"] .tile.doc:not(.adr)::before{opacity:.35}
[data-design="glass"] .tile:hover{transform:translateY(-2px);box-shadow:var(--hi),0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),0 12px 34px color-mix(in srgb,var(--c) 28%,transparent)}
[data-design="glass"] .tile.sel,[data-design="glass"] .group-head.sel{box-shadow:0 0 0 1.5px var(--accent),0 0 26px color-mix(in srgb,var(--accent) 45%,transparent)}
[data-design="glass"] .tile.linked{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent),0 0 16px color-mix(in srgb,var(--accent) 25%,transparent)}
[data-design="glass"] .tile.hit{box-shadow:0 0 0 1.5px var(--accent2),0 0 20px color-mix(in srgb,var(--accent2) 35%,transparent)}
[data-design="glass"] .num{color:color-mix(in srgb,var(--c) 65%,var(--text));letter-spacing:.02em}
[data-design="glass"] .chip{background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--text));font-weight:550}
[data-design="glass"] .badge{background:transparent;border-color:var(--border);border-radius:999px;padding:0 7px}
[data-design="glass"] .bar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--text) 8%,transparent);gap:2px}
[data-design="glass"] .bar i{border-radius:4px;box-shadow:0 0 8px color-mix(in srgb,var(--c) calc(var(--glow)*100%),transparent)}
[data-design="glass"] .waffle i{border-radius:3px;box-shadow:0 0 6px color-mix(in srgb,var(--c) calc(var(--glow)*80%),transparent)}
[data-design="glass"] .tile.dlv{--c:var(--accent)}
[data-design="glass"] .big{font-weight:600;letter-spacing:-.02em}
[data-design="glass"] .kpi{border:1px solid color-mix(in srgb,var(--c) 30%,var(--border));border-left-width:1px;border-radius:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,transparent),transparent)}
[data-design="glass"] .kpi b{color:color-mix(in srgb,var(--c) 60%,var(--text))}
/* components */
[data-design="glass"] .row{background:var(--surface);border-color:var(--border);border-radius:10px}
[data-design="glass"] .row.specnode{border-left-width:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%),var(--surface)}
[data-design="glass"] .row .dot{box-shadow:0 0 8px var(--c)}
[data-design="glass"] .row.hl{box-shadow:0 0 0 1px var(--accent),0 0 14px color-mix(in srgb,var(--accent) 35%,transparent)}
[data-design="glass"] .el.on{filter:drop-shadow(0 0 4px currentColor)}
[data-design="glass"] .xl{stroke:var(--accent2);filter:drop-shadow(0 0 4px var(--accent2))}
[data-design="glass"] .seg{border-radius:999px;background:var(--surface);border-color:var(--border)}
[data-design="glass"] .seg button{background:transparent;border-radius:999px}
[data-design="glass"] .seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--text)}
[data-design="glass"] .idc{border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent)}
[data-design="glass"] code{background:color-mix(in srgb,var(--text) 8%,transparent)}
/* panel */
[data-design="glass"] #panel{background:var(--panel);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-left:1px solid var(--border);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
[data-design="glass"] .pn-head{border-bottom:1px solid var(--border)}
[data-design="glass"] .pn-head .x{background:var(--surface);border-radius:999px}
[data-design="glass"] .links a,[data-design="glass"] .links button{background:var(--surface);border-color:var(--border);border-radius:999px;padding:2px 10px}
[data-design="glass"] ul.reqs li{border-left:2px solid var(--c)}

/* ===================== Orbit design (data-design="orbit") ===================== */
:root[data-design="orbit"]{
  --bg:#04060b; --surface:rgba(255,255,255,.04); --surface2:rgba(255,255,255,.07); --text:#e7eaf2; --muted:#8e97ab;
  --border:rgba(255,255,255,.09); --accent:#e8b65a; --doc:#9aa6bf; --shadow:0 12px 40px rgba(0,0,0,.45); --tint:12%;
  --o-bg1:#0b1324; --o-bg2:#04060b; --o-ink:#cdd5e6; --o-ink2:#6f7a94; --o-node:#0a0f1c; --o-track:rgba(255,255,255,.07);
  --o-ring:rgba(205,213,230,.11); --o-ring-on:rgba(232,182,90,.6); --o-accent:#e8b65a; --o-accent2:#6ee7d8; --o-thread:rgba(205,213,230,.075);
  --o-panel:rgba(9,13,24,.74); --o-muted:#39425a; --o-star:rgba(255,255,255,.55); --o-on-accent:#1a1204;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root[data-design="orbit"]:not([data-theme="dark"]){
    --bg:#f3eee2; --surface:rgba(255,255,255,.55); --surface2:rgba(255,255,255,.8); --text:#1a2233; --muted:#6c6556;
    --border:rgba(26,34,51,.12); --accent:#b4532a; --doc:#5b6476; --shadow:0 12px 34px rgba(60,48,20,.12);
    --o-bg1:#faf6ec; --o-bg2:#ebe3d0; --o-ink:#1f2a3d; --o-ink2:#857f70; --o-node:#fbf8f1; --o-track:rgba(26,34,51,.08);
    --o-ring:rgba(31,42,61,.15); --o-ring-on:rgba(180,83,42,.65); --o-accent:#b4532a; --o-accent2:#0f766e; --o-thread:rgba(31,42,61,.08);
    --o-panel:rgba(251,248,241,.84); --o-muted:#d3ccba; --o-star:rgba(31,42,61,.22); --o-on-accent:#fff;
    color-scheme: light;
  }
}
:root[data-design="orbit"][data-theme="light"]{
  --bg:#f3eee2; --surface:rgba(255,255,255,.55); --surface2:rgba(255,255,255,.8); --text:#1a2233; --muted:#6c6556;
  --border:rgba(26,34,51,.12); --accent:#b4532a; --doc:#5b6476; --shadow:0 12px 34px rgba(60,48,20,.12);
  --o-bg1:#faf6ec; --o-bg2:#ebe3d0; --o-ink:#1f2a3d; --o-ink2:#857f70; --o-node:#fbf8f1; --o-track:rgba(26,34,51,.08);
  --o-ring:rgba(31,42,61,.15); --o-ring-on:rgba(180,83,42,.65); --o-accent:#b4532a; --o-accent2:#0f766e; --o-thread:rgba(31,42,61,.08);
  --o-panel:rgba(251,248,241,.84); --o-muted:#d3ccba; --o-star:rgba(31,42,61,.22); --o-on-accent:#fff;
  color-scheme: light;
}
[data-design="orbit"] body{background:radial-gradient(ellipse 90% 70% at 50% 0%,var(--o-bg1),var(--o-bg2) 70%) fixed}
[data-design="orbit"] header.top{background:color-mix(in srgb,var(--o-bg2) 80%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--border)}
[data-design="orbit"] h1{font-weight:600;display:flex;align-items:center;gap:10px}
[data-design="orbit"] h1::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 0 0 3px var(--o-bg2),inset 0 0 0 7px var(--accent)}
[data-design="orbit"] .pchip,[data-design="orbit"] .iconbtn,[data-design="orbit"] .search{background:var(--surface);border-color:var(--border);border-radius:999px}
[data-design="orbit"] .iconbtn{padding:5px 12px}
[data-design="orbit"] .tabs{gap:4px}
[data-design="orbit"] .tab{border:0;border-radius:999px;padding:6px 14px;font-weight:550}
[data-design="orbit"] .tab[aria-selected="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
[data-design="orbit"] .card,[data-design="orbit"] .tbl-wrap,[data-design="orbit"] .matrix-wrap,[data-design="orbit"] .group,[data-design="orbit"] .loop{background:var(--surface);border-color:var(--border);border-radius:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
[data-design="orbit"] table.t th{background:transparent;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
[data-design="orbit"] .row{border-radius:10px;background:var(--surface);border-color:var(--border)}
[data-design="orbit"] #panel{background:var(--o-panel);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
[data-design="orbit"] .links a,[data-design="orbit"] .links button{border-radius:999px;background:var(--surface)}
body.o-full{overflow:hidden}
body.o-full main{max-width:none;padding:0}
body.o-full .gen,body.o-full .legend{display:none}
/* canvas */
.orbit{position:relative;height:calc(100vh - var(--hdr,96px));height:calc(100dvh - var(--hdr,96px));overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,var(--o-bg1),var(--o-bg2) 78%)}
.orbit::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;
  background-image:radial-gradient(1px 1px at 20px 30px,var(--o-star),transparent 50%),radial-gradient(1px 1px at 140px 90px,var(--o-star),transparent 50%),
    radial-gradient(1.4px 1.4px at 90px 170px,var(--o-star),transparent 50%),radial-gradient(1px 1px at 210px 220px,var(--o-star),transparent 50%);
  background-size:250px 250px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 85%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 85%)}
#osvg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#osvg.o-grab{cursor:grabbing}
.o-ring{fill:none;stroke:var(--o-ring);stroke-width:1;vector-effect:non-scaling-stroke;transition:stroke .3s}
.o-ring.k-gate{stroke-dasharray:2 7;stroke-width:1.6}
.o-ring.k-spec{stroke:color-mix(in srgb,var(--o-accent) 22%,var(--o-ring))}
.o-ring.on{stroke:var(--o-ring-on);stroke-width:1.6}
.o-ringlabel{fill:var(--o-ink2);font-family:var(--font);font-weight:650;paint-order:stroke;stroke:var(--o-bg2);stroke-linejoin:round;pointer-events:none}
.o-ringlabel.on{fill:var(--o-accent)}
.o-area{fill:none;stroke:var(--o-ring);stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.o-thread{fill:none;stroke:var(--o-thread);stroke-width:1;vector-effect:non-scaling-stroke}
.o-nothreads #othreads{display:none}
.o-xarc{fill:none;stroke:var(--o-accent);stroke-width:1.6;stroke-dasharray:5 6;vector-effect:non-scaling-stroke;opacity:.85}
.o-fedge{fill:none;stroke:var(--c);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-dasharray:6 7;animation:oflow 1.1s linear infinite}
@keyframes oflow{to{stroke-dashoffset:-26}}
.o-ringmark{fill:none;stroke:var(--o-accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.o-pulse{fill:none;stroke:var(--o-accent);stroke-width:1.4;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:opulse 1.8s ease-out infinite}
@keyframes opulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
.o-n{cursor:pointer;transition:opacity .25s}
.o-hit{fill:transparent}
.o-n.hov .o-hit{stroke:var(--o-ink);stroke-width:1;vector-effect:non-scaling-stroke}
.o-core{fill:url(#o-core-fill);stroke:var(--o-accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.o-core-ring{fill:none;stroke:var(--o-accent);stroke-opacity:.55;stroke-width:1;stroke-dasharray:2 5;vector-effect:non-scaling-stroke}
.o-spin{animation:ospin 70s linear infinite}
@keyframes ospin{to{transform:rotate(360deg)}}
.o-doc{fill:var(--o-node);stroke:var(--o-ink);stroke-width:1.3;vector-effect:non-scaling-stroke}
.o-dot{fill:var(--c)}
.o-shape{fill:var(--o-node);stroke:var(--c);stroke-width:1.4;vector-effect:non-scaling-stroke}
.o-adr .o-shape{fill:color-mix(in srgb,var(--c) 22%,var(--o-node))}
.o-fill{fill:var(--c)}
.o-glow{fill:var(--c);opacity:.08}
.o-glow2{fill:var(--c);opacity:.14}
.o-disc{fill:var(--o-node)}
.o-track{fill:none;stroke:var(--o-track)}
.o-num{fill:var(--o-ink);font-family:var(--mono);font-weight:700;text-anchor:middle;dominant-baseline:central;display:none;pointer-events:none}
.o-zin .o-num{display:block}
.o-focusing .o-n:not(.lit){opacity:.1}
.o-focusing .o-thread,.o-focusing .o-xarc{opacity:.12}
.o-qactive .o-n.qdim{opacity:.1}
.o-n.qhit .o-hit{stroke:var(--o-accent2);stroke-width:1.5;vector-effect:non-scaling-stroke;fill:color-mix(in srgb,var(--o-accent2) 14%,transparent)}
/* labels */
#olabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.o-l{position:absolute;left:0;top:0;white-space:nowrap;font:500 12px/16px var(--font);color:var(--o-ink);will-change:transform;
  text-shadow:0 0 2px var(--o-bg2),0 0 6px var(--o-bg2),0 0 10px var(--o-bg2)}
.o-l i{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--c);margin-right:5px}
.o-l.k-spec{font-weight:600}
.o-l.k-adr i{font-weight:500}
.o-l.k-code,.o-l.k-test{font:500 11px/16px var(--mono);color:var(--o-ink2)}
.o-l.k-gspec{font-size:11px;color:var(--o-ink2)}
.o-l.k-area{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--o-ink2)}
.o-l.k-sys{text-align:center;line-height:1.3}
.o-l.k-sys b{display:block;font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.o-l.k-sys span{font-size:12px;color:var(--o-ink2)}
.o-l.k-core{text-align:center;line-height:1.15}
.o-l.k-core b{display:block;font-size:12px;font-weight:600}
.o-l.k-core span{display:block;font:700 17px/1.2 var(--mono);color:var(--o-accent)}
.o-l.k-core small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--o-ink2)}
/* HUD */
.o-hud{position:absolute;z-index:6;display:flex;gap:8px;transition:right .18s}
.o-tl{top:14px;left:14px;flex-direction:column;max-width:310px}
.o-tr{top:14px;right:14px}
.o-bl{left:14px;bottom:14px}
.o-br{right:14px;bottom:14px;align-items:flex-end}
.o-card{background:var(--o-panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.o-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--o-panel);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:550;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.o-btn:hover{border-color:color-mix(in srgb,var(--o-accent) 55%,var(--border))}
.o-btn:disabled{opacity:.4;cursor:default}
.o-btn.o-primary{background:var(--o-accent);color:var(--o-on-accent);border-color:transparent;box-shadow:0 6px 24px color-mix(in srgb,var(--o-accent) 35%,transparent)}
.o-btn:focus-visible,.o-zoom button:focus-visible,.o-seg button:focus-visible{outline:2px solid var(--o-accent);outline-offset:2px}
kbd{font:600 10.5px var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.o-proj{padding:10px 12px;min-width:250px}
.o-proj-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:7px}
.o-proj-h b{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
.o-proj-h span{font:500 10.5px var(--mono);color:var(--muted)}
.o-proj-h em{font-style:normal;color:var(--st-Partial)}
.o-proj-s{font-size:12px;color:var(--muted);margin-top:7px}
.o-proj-s b{color:var(--text);font-family:var(--mono)}
.o-lens{padding:10px 12px;width:300px;display:flex;flex-direction:column;gap:9px;font-size:12px}
.o-lens-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.o-lens-h>span{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.o-seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px}
.o-seg button{border:0;background:none;border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:550}
.o-seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--o-accent) 22%,transparent);color:var(--text)}
.o-leg{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}
.o-leg span{display:inline-flex;align-items:center;gap:5px}
.o-leg .sw,.o-pal .sw{border-radius:50%}
.o-grad{height:6px;width:100%;border-radius:4px;background:linear-gradient(90deg,var(--st-Gap),var(--st-Partial),var(--st-Implemented))}

.o-pal-t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('spectree-data').textContent);
const M = D.meta;
const ICON = {Implemented:'✓', Partial:'◐', Gap:'✕', Planned:'○', Deprecated:'–', Unknown:'?'};
const ORDER = ['Gap','Partial','Planned','Unknown','Implemented','Deprecated'];
const FIELDS = new Set(M.tile_fields);
const $ = s => document.querySelector(s);
const root = document.documentElement;
Object.entries(M.colors).forEach(([k,v]) => root.style.setProperty('--st-'+k, v));

const store = {
  get(k, d){ try { const v = localStorage.getItem('spectree:'+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('spectree:'+k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- indexes ---------- */
const specById = new Map(D.specs.map(s => [s.id, s]));
const docById = new Map(D.foundation.map(d => [d.id, d]));
const compById = new Map(D.components.map(c => [c.id, c]));
const projByKey = new Map(D.projects.map(p => [p.key, p]));
const reqToSpec = new Map();
D.specs.forEach(s => s.reqs.forEach(r => reqToSpec.set(r.id, s.id)));
const incoming = new Map();
D.specs.forEach(s => Object.entries(s.links).forEach(([t, ids]) => {
  if (!incoming.has(t)) incoming.set(t, new Map());
  incoming.get(t).set(s.id, ids);
}));
const docRefs = new Map();
D.specs.forEach(s => [...s.docs, ...s.adrs].forEach(d => {
  if (!docRefs.has(d)) docRefs.set(d, []);
  docRefs.get(d).push(s.id);
}));
const compsBySpec = new Map();
D.components.forEach(c => Object.keys(c.specs).forEach(sid => {
  if (!compsBySpec.has(sid)) compsBySpec.set(sid, []);
  compsBySpec.get(sid).push(c.id);
}));
const crossOf = id => D.cross.filter(e => e.from === id || e.to === id);

const state = {
  tab: store.get('tab', 'flow'),
  projects: new Set(D.projects.map(p => p.key)),
  q: '',
  expanded: new Set(store.get('expanded', [])),
  selected: null,
  cmpTests: store.get('cmpTests', true),
  cmpExpandUI: store.get('cmpExpandUI', false),
  cmpView: store.get('cmpView', 'lines'),
  cmpCollapsed: new Set(store.get('cmpCollapsed', D.projects.flatMap(p => (M.collapsed_layers || []).map(l => p.key + '|' + l)))),
};
const TABS = ['flow','components','status'];
const hashParams = new URLSearchParams((location.hash || '').replace(/^#/, '').replace(/^(flow|components|status)(&|$)/, 'tab=$1$2'));
const hashTab = hashParams.get('tab') || '';
if (TABS.includes(hashTab)) state.tab = hashTab;
if (!TABS.includes(state.tab)) state.tab = 'flow';

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const projName = k => (projByKey.get(k) || {}).name || k;
const groupLabel = g => (g.length <= 3 ? g.toUpperCase() : g.charAt(0).toUpperCase() + g.slice(1));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function chip(st){ return `<span class="chip" style="--c:var(--st-${st})"><i>${ICON[st] || ''}</i>${esc(st)}</span>`; }
function bar(counts, title){
  const total = sum(counts);
  if (!total) return '<div class="bar"></div>';
  const segs = ['Implemented','Partial','Planned','Gap','Unknown','Deprecated']
    .filter(k => counts[k]).map(k => `<i style="--c:var(--st-${k});flex:${counts[k]}"></i>`).join('');
  const t = title || Object.entries(counts).filter(([,v]) => v).map(([k,v]) => `${k} ${v}`).join(' · ');
  return `<div class="bar" title="${esc(t)}">${segs}</div>`;
}
function worst(statuses){
  for (const s of ORDER) if (statuses.includes(s)) return s;
  return 'Unknown';
}
function specText(s){
  if (!s._t) s._t = [s.number, s.title, s.name, s.area, s.status,
    ...s.reqs.map(r => `${r.id} ${r.title} ${r.sources.join(' ')}`)].join(' ').toLowerCase();
  return s._t;
}
function docText(d){
  if (!d._t) d._t = [d.title, d.subtitle, d.path, d.number, d.status, ...d.sections].join(' ').toLowerCase();
  return d._t;
}
const matches = t => !state.q || t.includes(state.q);
const visible = () => D.projects.filter(p => state.projects.has(p.key));
function shortStatus(s){ return (s || '').replace(/\s*\(.*$/, '').split(/[;,]/)[0]; }

/* ---------- header ---------- */
function renderHeader(){
  $('#title').textContent = M.title;
  document.title = M.title;
  $('#projchips').innerHTML = D.projects.map(p => `
    <label class="pchip" title="${esc(p.repo_url || '')}">
      <input type="checkbox" data-proj="${esc(p.key)}" ${state.projects.has(p.key) ? 'checked' : ''}>
      <b>${esc(p.name)}</b>
      <span class="ref">${esc(p.branch || '?')}@${esc(p.sha || '?')}</span>
      ${p.dirty ? `<span class="dirty" title="${p.dirty_count} uncommitted change(s): the page shows the working tree">● uncommitted</span>` : ''}
    </label>`).join('');
  $('#legend').innerHTML = M.statuses.filter(s => s !== 'Unknown' || D.specs.some(x => x.status === 'Unknown'))
    .map(s => `<span><i class="sw" style="--c:var(--st-${s})"></i>${esc(s)}</span>`).join('') +
    `<span title="A spec takes the colour of its weakest active requirement: any Gap → Gap, any Partial (or Planned mixed with Implemented) → Partial, all Implemented → Implemented. Deprecated requirements are ignored.">ⓘ spec colour = weakest requirement</span>`;
  $('#gen').innerHTML = `Generated ${esc(M.generated_at)} · spectree ${esc(M.generator_version)} · ` +
    D.projects.map(p => `${esc(p.name)}: ${plural(p.spec_count,'spec')}, ${plural(p.req_count,'requirement')}`).join(' · ');
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
  const h = document.querySelector('header.top').offsetHeight;
  root.style.setProperty('--hdr', h + 'px');
}

/* ---------- tiles ---------- */
function specTile(s, small){
  const hit = state.q && matches(specText(s));
  const cls = ['tile', 'spec', small ? 'sm' : '', state.q ? (hit ? 'hit' : 'dim') : ''].join(' ');
  const total = s.reqs.length;
  if (small){
    return `<button class="${cls}" data-node="${esc(s.id)}" style="--c:var(--st-${s.status})" title="${esc(s.number+' '+s.title+' — '+s.status)}">
      <div class="t-top">${FIELDS.has('number') ? `<span class="num">${esc(s.number)}</span>` : '<span></span>'}${FIELDS.has('status') ? `<span class="chip" style="--c:var(--st-${s.status})"><i>${ICON[s.status]}</i></span>` : ''}</div>
      ${FIELDS.has('title') ? `<div class="t-title">${md(s.title)}</div>` : ''}
    </button>`;
  }
  const meta = [];
  if (FIELDS.has('req_count')) meta.push(`<span><b>${total}</b> reqs</span>`);
  if (FIELDS.has('tasks') && s.tasks.total) meta.push(`<span><b>${s.tasks.done}/${s.tasks.total}</b> tasks</span>`);
  if (FIELDS.has('evidence') && s.evidence.implemented) meta.push(`<span><b>${pct(s.evidence.tested, s.evidence.implemented)}%</b> tested</span>`);
  const badges = [];
  if (FIELDS.has('adrs')) s.adrs.forEach(a => { const d = docById.get(a); if (d) badges.push(`<span class="badge">ADR ${esc(d.number)}${d.project !== s.project ? ' ↗' : ''}</span>`); });
  if (FIELDS.has('gaps') && s.gaps.length) badges.push(`<span class="badge gap">${plural(s.gaps.length,'open gap')}</span>`);
  if (crossOf(s.id).length) badges.push(`<span class="badge" title="Linked to another project">⇄ cross-project</span>`);
  return `<button class="${cls}" data-node="${esc(s.id)}" style="--c:var(--st-${s.status})">
    <div class="t-top">${FIELDS.has('number') ? `<span class="num">${esc(s.number)}</span>` : '<span></span>'}${FIELDS.has('status') ? chip(s.status) : ''}</div>
    ${FIELDS.has('title') ? `<div class="t-title">${md(s.title)}</div>` : ''}
    ${FIELDS.has('status_bar') ? bar(s.counts) : ''}
    ${meta.length ? `<div class="t-meta">${meta.join('')}</div>` : ''}
    ${badges.length ? `<div class="t-badges">${badges.join('')}</div>` : ''}
  </button>`;
}
function docTile(d){
  const hit = state.q && matches(docText(d));
  const cls = ['tile', 'doc', d.kind, state.q ? (hit ? 'hit' : 'dim') : ''].join(' ');
  const style = d.status_cat ? `style="--c:var(--st-${d.status_cat})"` : '';
  const stats = d.stats.map(s => `<span><b>${esc(s.value)}</b> ${esc(s.label)}</span>`).join('');
  const top = d.kind === 'adr'
    ? `<div class="t-top"><span class="num">ADR ${esc(d.number)}</span><span class="adr-st" title="${esc(d.status)}">${esc(shortStatus(d.status))}</span></div>`
    : '';
  return `<button class="${cls}" data-node="${esc(d.id)}" ${style} title="${esc(d.path)}">
    ${top}<div class="t-title">${md(d.title)}</div>
    ${stats ? `<div class="t-meta">${stats}</div>` : ''}
  </button>`;
}
function groupBlock(p, group, specs){
  const key = p.key + '|' + group;
  const roll = {}; const counts = {};
  specs.forEach(s => { roll[s.status] = (roll[s.status] || 0) + 1; Object.entries(s.counts).forEach(([k,v]) => counts[k] = (counts[k] || 0) + v); });
  const hits = state.q ? specs.filter(s => matches(specText(s))).length : 0;
  const open = state.expanded.has(key) || hits > 0;
  const status = worst(Object.keys(roll).filter(k => k !== 'Deprecated'));
  let body = '';
  if (open){
    const areas = new Map();
    specs.forEach(s => { const a = s.area || 'All'; if (!areas.has(a)) areas.set(a, []); areas.get(a).push(s); });
    body = `<div class="group-body">` + [...areas].map(([a, list]) => {
      const ar = {}; list.forEach(s => ar[s.status] = (ar[s.status] || 0) + 1);
      return `<div class="area"><div class="area-h">${esc(a)} <span class="muted">${list.length}</span>${bar(ar)}</div>
        <div class="tiles sm">${list.map(s => specTile(s, true)).join('')}</div></div>`;
    }).join('') + `</div>`;
  }
  return `<div class="group ${open ? 'open' : ''}">
    <button class="group-head" data-group="${esc(key)}" aria-expanded="${open}">
      <div class="gh-top"><span class="caret">▶</span><b>${esc(groupLabel(group))} specs</b>
        <span class="muted">${plural(specs.length,'spec')} · ${plural(sum(counts),'requirement')}</span>
        ${chip(status)}${hits ? `<span class="hits">${hits} match${hits === 1 ? '' : 'es'}</span>` : ''}</div>
      ${bar(roll, Object.entries(roll).map(([k,v]) => `${v} spec(s) ${k}`).join(' · '))}
      <div class="waffle" aria-hidden="true">${specs.map(s => `<i style="--c:var(--st-${s.status})" title="${esc(s.number + ' ' + s.title)}"></i>`).join('')}</div>
    </button>${body}</div>`;
}
function deliveryCell(p){
  const P = projByKey.get(p.key);
  const layers = {};
  D.components.filter(c => c.project === p.key && c.kind === 'code').forEach(c => layers[c.layer] = (layers[c.layer] || 0) + 1);
  const top = Object.entries(layers).sort((a,b) => b[1] - a[1]).slice(0, 4).map(([k,v]) => `${v} ${k.toLowerCase()}`).join(' · ');
  const ev = pct(P.evidence.tested, P.evidence.implemented);
  return `<div class="dl">
    <button class="tile dlv" data-node="delivery:${esc(p.key)}"><div class="t-meta">Tasks done</div><div class="big">${P.tasks.done} / ${P.tasks.total}</div>${bar({Implemented:P.tasks.done, Planned:P.tasks.total - P.tasks.done})}</button>
    <button class="tile dlv" data-tabjump="components"><div class="t-meta">Code components linked to specs</div><div class="big">${P.components}</div><div class="t-meta">${esc(top)}</div></button>
    <button class="tile dlv" data-node="delivery:${esc(p.key)}"><div class="t-meta">Implemented reqs cited by a test</div><div class="big">${ev}%</div><div class="t-meta">${P.evidence.tested} of ${P.evidence.implemented} · ${plural(P.test_files,'test file')}</div></button>
  </div>`;
}
function layerCell(layer, idx, p){
  if (layer.kind === 'specs'){
    const specs = D.specs.filter(s => s.project === p.key);
    if (!specs.length) return null;
    const core = specs.filter(s => !s.group || !M.group_folders);
    const groups = new Map();
    specs.filter(s => s.group && M.group_folders).forEach(s => { if (!groups.has(s.group)) groups.set(s.group, []); groups.get(s.group).push(s); });
    return (core.length ? `<div class="tiles">${core.map(s => specTile(s)).join('')}</div>` : '') +
      [...groups].map(([g, list]) => groupBlock(p, g, list)).join('');
  }
  if (layer.kind === 'delivery') return D.specs.some(s => s.project === p.key) ? deliveryCell(p) : null;
  const docs = D.foundation.filter(d => d.project === p.key && d.layer_index === idx);
  if (!docs.length) return null;
  return `<div class="tiles ${layer.kind === 'adr' ? 'adr' : 'docs'}">${docs.map(docTile).join('')}</div>`;
}

/* ---------- flow view ---------- */
function renderFlow(){
  if (isOrbit()) return orbitRender();
  const ps = visible();
  let h = '';
  if (M.workflow_steps.length){
    h += `<section class="loop"><h2>How a change moves through SDD</h2><ol>${M.workflow_steps.map((s, i) =>
      `<li><b>${i + 1}. ${esc(s.label)}</b><span>${md(s.text)}</span></li>`).join('')}</ol></section>`;
  }
  const rows = [];
  M.flow.forEach((layer, i) => {
    const cells = ps.map(p => layerCell(layer, i, p));
    if (cells.every(c => c === null)) return;
    rows.push({layer, cells});
  });
  h += `<div class="flow-wrap"><div class="flow" style="--cols:${ps.length}">`;
  h += `<div class="fl-head"></div>` + ps.map(p => `<div class="fl-head">${esc(p.name)}<small>${plural(p.spec_count,'spec')} · ${plural(p.req_count,'requirement')}</small></div>`).join('');
  rows.forEach((r, n) => {
    h += `<div class="fl-label ${n === rows.length - 1 ? 'last' : ''}"><span class="step">${n + 1}</span><div><b>${esc(r.layer.name)}</b><small>${esc(r.layer.explain || '')}</small></div></div>`;
    h += r.cells.map((c, j) => `<div class="fl-cell" data-proj="${esc(ps[j].name)}">${c ?? '<span class="empty">—</span>'}</div>`).join('');
  });
  h += `</div><svg class="overlay flowx" id="xsvg"></svg></div>`;
  $('#view').innerHTML = h;
  requestAnimationFrame(() => { drawCross(); applySelection(); });
}
function nodeEl(id){
  const el = document.querySelector(`#view [data-node="${CSS.escape(id)}"]`);
  if (el) return el;
  const s = specById.get(id);
  if (s && s.group) return document.querySelector(`#view [data-group="${CSS.escape(s.project + '|' + s.group)}"]`);
  return null;
}
function curve(x1, y1, x2, y2){
  const dx = Math.max(40, Math.abs(x2 - x1) / 2);
  return `M${x1},${y1} C${x1 + (x2 > x1 ? dx : -dx)},${y1} ${x2 + (x2 > x1 ? -dx : dx)},${y2} ${x2},${y2}`;
}
function drawCross(){
  const svg = $('#xsvg'); if (!svg) return;
  const wrap = svg.parentElement; const wr = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrap.scrollWidth); svg.setAttribute('height', wrap.scrollHeight);
  if (visible().length < 2){ svg.innerHTML = ''; return; }
  const pairs = new Map();
  D.cross.forEach(e => {
    const a = nodeEl(e.from), b = nodeEl(e.to);
    if (!a || !b || a === b) return;
    const ka = a.dataset.node || a.dataset.group, kb = b.dataset.node || b.dataset.group;
    const key = [ka, kb].sort().join('>');
    if (!pairs.has(key)) pairs.set(key, {a, b, labels: new Set(), ids: new Set()});
    const p = pairs.get(key); p.labels.add(e.label); e.ids.forEach(i => p.ids.add(i));
  });
  let out = '';
  pairs.forEach(({a, b, labels, ids}) => {
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const ax = ra.left < rb.left ? ra.right : ra.left, bx = ra.left < rb.left ? rb.left : rb.right;
    const ay = ra.top + Math.min(ra.height / 2, 40), by = rb.top + Math.min(rb.height / 2, 40);
    const t = [...labels].join('; ') + (ids.size ? ' — ' + [...ids].slice(0, 12).join(', ') : '');
    out += `<path class="xl" d="${curve(ax - wr.left, ay - wr.top, bx - wr.left, by - wr.top)}"><title>${esc(t)}</title></path>`;
  });
  svg.innerHTML = out;
}

/* ---------- components view ---------- */
function layerRank(l){ const i = (M.layer_order || []).indexOf(l); return i < 0 ? 999 : i; }
function rightNodeOf(s){
  if (!s.group || !M.group_folders || state.cmpExpandUI) return s.id;
  return `area:${s.project}|${s.group}|${s.area || 'All'}`;
}
function renderComponents(){
  const ps = visible();
  const comps = D.components.filter(c => state.projects.has(c.project) && (state.cmpTests || c.kind !== 'test'));
  // right-hand nodes
  const right = new Map();
  ps.forEach(p => D.specs.filter(s => s.project === p.key).forEach(s => {
    const id = rightNodeOf(s);
    if (!right.has(id)){
      right.set(id, id === s.id
        ? {id, project: s.project, label: s.title, num: s.number, specs: [s], area: false}
        : {id, project: s.project, label: `${groupLabel(s.group)} · ${s.area || 'All'}`, num: '', specs: [], area: true});
    }
    if (id !== s.id) right.get(id).specs.push(s);
  }));
  right.forEach(n => n.status = n.area ? worst(n.specs.map(s => s.status).filter(x => x !== 'Deprecated')) : n.specs[0].status);
  // edges
  const edges = new Map();
  comps.forEach(c => Object.entries(c.specs).forEach(([sid, ids]) => {
    const s = specById.get(sid); if (!s || !state.projects.has(s.project)) return;
    const t = rightNodeOf(s); const k = c.id + '>' + t;
    if (!edges.has(k)) edges.set(k, {a: c.id, b: t, w: 0, ids: []});
    const e = edges.get(k); e.w += ids.length; e.ids.push(...ids);
  }));
  // search filter
  let showComp = c => true, showRight = n => true;
  if (state.q){
    const hitR = new Set([...right.values()].filter(n => n.specs.some(s => matches(specText(s))) || matches(n.label.toLowerCase())).map(n => n.id));
    const hitC = new Set(comps.filter(c => matches(c.path.toLowerCase())).map(c => c.id));
    edges.forEach(e => { if (hitC.has(e.a)) hitR.add(e.b); });
    edges.forEach(e => { if (hitR.has(e.b) && !hitC.has(e.a)) hitC.add(e.a); });
    showComp = c => hitC.has(c.id); showRight = n => hitR.has(n.id);
  }
  const degC = new Map(), degR = new Map();
  edges.forEach(e => { degC.set(e.a, (degC.get(e.a) || 0) + 1); degR.set(e.b, (degR.get(e.b) || 0) + 1); });

  let h = `<div class="cbar">
    <div class="seg" role="group" aria-label="View"><button data-cmpview="lines" aria-pressed="${state.cmpView === 'lines'}">Lines</button><button data-cmpview="matrix" aria-pressed="${state.cmpView === 'matrix'}">Matrix</button></div>
    <label><input type="checkbox" id="cmpTests" ${state.cmpTests ? 'checked' : ''}> include tests</label>
    ${D.specs.some(s => s.group) && M.group_folders ? `<label><input type="checkbox" id="cmpUI" ${state.cmpExpandUI ? 'checked' : ''}> show each grouped spec (not areas)</label>` : ''}
    <span class="hint">Code files come from each requirement's <code>Source:</code> line; tests from requirement IDs they cite. Hover to trace, click for details.</span>
  </div>`;
  const leftGroups = [];
  ps.forEach(p => {
    const byLayer = new Map();
    comps.filter(c => c.project === p.key && showComp(c)).forEach(c => { if (!byLayer.has(c.layer)) byLayer.set(c.layer, []); byLayer.get(c.layer).push(c); });
    leftGroups.push({p, byLayer});
  });
  const rightNodes = [...right.values()].filter(showRight);

  if (state.cmpView === 'matrix'){
    const cols = rightNodes.filter(n => degR.get(n.id));
    const rowsC = comps.filter(c => showComp(c) && degC.get(c.id));
    const maxW = Math.max(1, ...[...edges.values()].map(e => e.w));
    h += `<div class="matrix-wrap"><table class="mx"><thead><tr><th class="rh">component \\ spec</th>${cols.map(n =>
      `<th title="${esc(projName(n.project) + ' · ' + (n.num ? n.num + ' ' : '') + n.label)}" data-cnode="${esc(n.id)}"><div>${esc((n.num ? n.num + ' ' : '') + n.label)}</div></th>`).join('')}</tr></thead><tbody>`;
    rowsC.forEach(c => {
      h += `<tr><th class="rh" data-cnode="${esc(c.id)}" title="${esc(c.path)}">${c.kind === 'test' ? '🧪 ' : ''}${esc(c.path)}</th>`;
      cols.forEach(n => {
        const e = edges.get(c.id + '>' + n.id);
        h += e ? `<td class="v" data-cnode="${esc(n.id)}" style="--c:var(--st-${n.status});--a:${25 + Math.round(60 * e.w / maxW)}%" title="${esc(c.path + ' → ' + n.label + ': ' + e.ids.slice(0, 10).join(', '))}">${e.w}</td>` : '<td></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    $('#view').innerHTML = h;
    return;
  }

  ps.forEach(({key, name}, bi) => {
    const lg = leftGroups.find(g => g.p.key === key);
    const list = rightNodes.filter(n => n.project === key);
    if (!lg.byLayer.size && !list.length) return;
    h += `<section class="cvb">${ps.length > 1 ? `<h3 class="cv-ph">${esc(name)}</h3>` : ''}<div class="cv" data-proj="${esc(key)}"><div class="cv-col cvL">`;
    [...lg.byLayer].sort((a,b) => layerRank(a[0]) - layerRank(b[0]) || a[0].localeCompare(b[0])).forEach(([layer, items]) => {
      const lk = key + '|' + layer; const col = state.cmpCollapsed.has(lk);
      h += `<button class="cv-lh" data-collapse="${esc(lk)}" data-lnode="${esc(lk)}"><span class="caret" style="transform:rotate(${col ? 0 : 90}deg)">▶</span>${esc(layer)} <span class="muted">${items.length}</span></button>`;
      if (!col) items.forEach(c => {
        const i = c.path.lastIndexOf('/');
        h += `<div class="row comp" tabindex="0" data-cnode="${esc(c.id)}" title="${esc(c.path)}">
          <span class="k ${c.kind}">${c.kind === 'test' ? 'TEST' : 'CODE'}</span>
          <span class="p"><span>${esc(c.path.slice(0, i + 1))}</span>${esc(c.path.slice(i + 1))}</span>
          <span class="n">${degC.get(c.id) || 0}</span></div>`;
      });
    });
    h += `</div><div></div><div class="cv-col cvR">`;
    list.forEach(n => {
      const d = degR.get(n.id) || 0;
      h += `<div class="row specnode ${d ? '' : 'fade'}" tabindex="0" data-cnode="${esc(n.id)}" style="--c:var(--st-${n.status})" title="${esc(n.label)}${d ? '' : ' — no code linked'}">
        <span class="dot"></span>${n.num ? `<span class="num">${esc(n.num)}</span>` : ''}<span class="t">${esc(n.label)}${n.area ? ` <span class="muted">(${n.specs.length})</span>` : ''}</span><span class="n">${d}</span></div>`;
    });
    h += `</div><svg class="overlay esvg"></svg></div></section>`;
  });
  const crossCount = [...edges.values()].filter(e => compById.get(e.a).project !== (right.get(e.b) || {}).project).length;
  if (crossCount) h += `<p class="hint">${plural(crossCount, 'link')} from one project's files to another project's specs are listed in the detail panel and the matrix, not drawn here.</p>`;
  $('#view').innerHTML = h;
  state._edges = [...edges.values()];
  state._right = right;
  requestAnimationFrame(() => { drawEdges(); applySelection(); });
}
function drawEdges(){
  document.querySelectorAll('#view .cv').forEach(cv => {
    const svg = cv.querySelector('svg.esvg'); const pk = cv.dataset.proj;
    const cr = cv.getBoundingClientRect();
    svg.setAttribute('width', cv.scrollWidth); svg.setAttribute('height', cv.scrollHeight);
    const leftEl = id => {
      const el = cv.querySelector(`.cvL [data-cnode="${CSS.escape(id)}"]`);
      if (el) return el;
      const c = compById.get(id); if (!c) return null;
      return cv.querySelector(`.cvL [data-lnode="${CSS.escape(c.project + '|' + c.layer)}"]`);
    };
    let out = '';
    (state._edges || []).forEach(e => {
      const n = state._right.get(e.b);
      if (!n || n.project !== pk || compById.get(e.a).project !== pk) return;
      const a = leftEl(e.a), b = cv.querySelector(`.cvR [data-cnode="${CSS.escape(e.b)}"]`);
      if (!a || !b) return;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      out += `<path class="el" data-a="${esc(e.a)}" data-b="${esc(e.b)}" stroke="var(--st-${n.status})" d="${curve(ra.right - cr.left, ra.top + ra.height / 2 - cr.top, rb.left - cr.left, rb.top + rb.height / 2 - cr.top)}"><title>${esc(e.ids.slice(0, 12).join(', '))}</title></path>`;
    });
    svg.innerHTML = out;
  });
}
function traceComponents(id){
  const paths = document.querySelectorAll('#view svg.esvg path.el');
  document.querySelectorAll('#view .cv .row.hl').forEach(r => r.classList.remove('hl'));
  if (!id){ paths.forEach(p => p.classList.remove('on', 'off')); return; }
  const linked = new Set([id]);
  paths.forEach(p => {
    const on = p.dataset.a === id || p.dataset.b === id;
    p.classList.toggle('on', on); p.classList.toggle('off', !on);
    if (on){ linked.add(p.dataset.a); linked.add(p.dataset.b); }
  });
  linked.forEach(n => document.querySelectorAll(`#view .cv [data-cnode="${CSS.escape(n)}"]`).forEach(r => r.classList.add('hl')));
}

/* ---------- status view ---------- */
function renderStatus(){
  const ps = visible();
  let h = `<div class="cards">`;
  ps.forEach(p => {
    const kp = M.statuses.filter(s => p.counts[s] || ['Implemented','Partial','Gap'].includes(s))
      .map(s => `<div class="kpi" style="--c:var(--st-${s})"><b>${p.counts[s]}</b><span>${esc(s)} reqs</span></div>`).join('');
    h += `<div class="card"><h3>${esc(p.name)}</h3><div class="kpis">${kp}</div>
      <dl class="kv">
        <dt>Specs by status</dt><dd>${bar(p.rollup)}<span class="muted" style="font-size:12px">${Object.entries(p.rollup).filter(([,v]) => v).map(([k,v]) => `${v} ${k}`).join(' · ')}</span></dd>

function oBuildSystem(p){

  const push = r => { if (r.nodes.length) sys.rings.push(r); };
  M.flow.forEach((layer, li) => {
    const explain = layer.explain || '';
    if (layer.kind === 'docs' || layer.kind === 'adr'){
      const type = layer.kind === 'adr' ? 'adr' : /gate/i.test(layer.name) ? 'gate' : /contract/i.test(layer.name) ? 'contract' : 'doc';
      push({label: layer.name, explain, kind: type, nodes: D.foundation.filter(d => d.project === p.key && d.layer_index === li)
        .map(d => ({id: d.id, type, ref: d, size: OSIZE[type]}))});
    } else if (layer.kind === 'specs'){
      const specs = D.specs.filter(s => s.project === p.key);
      push({label: layer.name, explain, kind: 'spec',
        nodes: specs.filter(s => !s.group || !M.group_folders).map(s => ({id: s.id, type: 'spec', ref: s, size: specSize(s)}))});
      if (M.group_folders && !O.detail){
        const ring = sys.rings[sys.rings.length - 1];
        [...new Set(specs.filter(s => s.group).map(s => s.group))].forEach(g => {
          const ref = oGroupRef(p.key, g, specs.filter(s => s.group === g));
          ring.nodes.push({id: ref.id, type: 'spec', grp: true, ref, size: specSize(ref) + 4});
        });
      }
      if (M.group_folders && O.detail) [...new Set(specs.filter(s => s.group).map(s => s.group))].forEach(g => push({
        label: `${groupLabel(g)} specs`, kind: 'gspec',
        explain: 'Grouped specs, arranged by area. Each dot is one spec, coloured by its status.',
        nodes: specs.filter(s => s.group === g).map(s => ({id: s.id, type: 'gspec', ref: s, size: OSIZE.gspec}))}));
    } else if (layer.kind === 'delivery' && O.detail){
      const comps = D.components.filter(c => c.project === p.key);
      push({label: 'Code', kind: 'code', explain: 'Files named in requirement Source lines. Each file sits beside the specs it implements.',
        nodes: comps.filter(c => c.kind === 'code').map(c => ({id: c.id, type: 'code', ref: c, size: OSIZE.code}))});
      push({label: 'Tests', kind: 'test', explain: 'Test files that cite requirement IDs. A cited requirement has test evidence.',
        nodes: comps.filter(c => c.kind === 'test').map(c => ({id: c.id, type: 'test', ref: c, size: OSIZE.test}))});
    }
  });

  ring.nodes.forEach(nd => {
    const as = [];

    nd.want = circMean(as);

  const withW = ring.nodes.filter(n => n.want !== null).sort((a, b) => normA(a.want) - normA(b.want));
  const order = withW.concat(ring.nodes.filter(n => n.want === null));

function oLayout(){
  O.systems = visible().map(oBuildSystem);
  O.nodes = new Map();
  O.systems.forEach(sys => {
    let edge = 0;
    sys.rings.forEach(ring => {
      const maxS = Math.max(...ring.nodes.map(n => n.size));
      if (ring.core){ ring.r = 0; edge = maxS + 16; return; }
      let span = ring.nodes.reduce((a, n) => a + 2 * n.size + OSPACE[ring.kind], 0);
      if (ring.kind === 'gspec') span += oAreas(ring).length * 30;
      const gap = ring.kind === 'spec' ? 70 : ring.kind === 'gspec' ? 46 : ring.kind === 'code' ? 56 : 44;
      ring.r = Math.max(edge + gap + maxS, span / TAU);

    });
    sys.R = edge + 80;
    sys.rings.forEach(r => r.nodes.forEach(n => O.nodes.set(n.id, n)));

  let x = 0;
  O.systems.forEach(sys => { sys.cx = x + sys.R; sys.cy = 0; x += 2 * sys.R + 140; });
  O.systems.forEach(sys => sys.rings.forEach(ring => {
    if (ring.core){ ring.nodes[0].a = -Math.PI / 2; return; }

    const n = ring.nodes.length;

  const pos = (sys, ring) => ring.nodes.forEach(nd => { nd.x = sys.cx + ring.r * Math.cos(nd.a); nd.y = sys.cy + ring.r * Math.sin(nd.a); });
  O.systems.forEach(sys => sys.rings.forEach(ring => { if (ring.nodes[0].a !== undefined) pos(sys, ring); }));
  O.systems.forEach(sys => sys.rings.forEach(ring => { if (ring.kind === 'gspec'){ oPlaceAreas(ring, sys); pos(sys, ring); } }));
  O.systems.forEach(sys => sys.rings.forEach(ring => { if (ring.kind === 'code' || ring.kind === 'test'){ oPlaceBary(ring, sys); pos(sys, ring); } }));
  const S = O.systems;

    Math.max(...S.map(s => s.cx + s.R)), Math.max(...S.map(s => s.cy + s.R))] : [0, 0, 1, 1];
}

/* ---------- colour ---------- */
function pctColor(p){

}
function compStatus(c){

}
function oColor(nd){
  const L = O.lens, r = nd.ref;
  if (nd.type === 'spec' || nd.type === 'gspec'){
    if (L === 'evidence') return r.evidence.implemented ? pctColor(pct(r.evidence.tested, r.evidence.implemented)) : 'var(--o-muted)';
    if (L === 'tasks') return r.tasks.total ? pctColor(pct(r.tasks.done, r.tasks.total)) : 'var(--o-muted)';
    return `var(--st-${r.status})`;
  }

  return ['Implemented', 'Partial', 'Planned', 'Gap', 'Unknown', 'Deprecated'].map(k => ({v: s.counts[k], c: `var(--st-${k})`}));
}

/* ---------- labels (screen space, collision-free like a map) ---------- */

function oLabelEl(c){

}
function oEff(){
  const lit = O.lit, q = O.qset;
  O.cands.forEach(c => {
    let e = c.pri;
    if (c.id){
      if (lit) e = lit.has(c.id) ? e + 600 : (c.kind === 'core' ? e : -1);
      if (q && e >= 0) e = q.has(c.id) ? e + 500 : -1;
      if (c.id === O.focus || c.id === O.hover) e = Math.max(e, 0) + 2000;
    } else if (c.kind === 'area' && (lit || q)) e = -1;
    c.eff = e;
  });
  O.sorted = O.cands.filter(c => c.eff >= 0).sort((a, b) => b.eff - a.eff);

}
function oSchedule(){ if (!O.raf) O.raf = requestAnimationFrame(oLabels); }
function oLabels(){
  O.raf = 0;
  if (!O.el.labels || !O.cam) return;
  const {k, x: tx, y: ty} = O.cam, W = O.W, H = O.H, kr = k / O.kFit;
  const placed = [], shown = new Set();
  for (const c of O.sorted){
    if (placed.length > 240) break;
    if (kr < c.minK && c.eff < 600) continue;
    const sx = c.x * k + tx, sy = c.y * k + ty, off = c.size * k + 6, dx = c.dir[0], dy = c.dir[1];
    let bx, by;
    if (c.center){ bx = sx - c.w / 2; by = sy - c.h / 2; }
    else if (Math.abs(dx) < 0.4){ bx = sx - c.w / 2; by = dy < 0 ? sy - off - c.h : sy + off; }
    else if (dx > 0){ bx = sx + off; by = sy - c.h / 2 + dy * 3; }
    else { bx = sx - off - c.w; by = sy - c.h / 2 + dy * 3; }
    if (bx + c.w < 0 || by + c.h < 0 || bx > W || by > H) continue;
    let hit = false;
    if (c.eff < 2000) for (const p of placed){ if (bx < p[2] && bx + c.w > p[0] && by < p[3] && by + c.h > p[1]){ hit = true; break; } }
    if (hit) continue;
    placed.push([bx - 4, by - 2, bx + c.w + 4, by + c.h + 2]);
    const el = c.el || oLabelEl(c);
    el.style.transform = `translate(${bx.toFixed(1)}px,${by.toFixed(1)}px)`;
    el.style.display = '';

}

/* ---------- camera ---------- */
function oPanelW(){ return ($('#panel').classList.contains('open') && O.W > 760) ? Math.min(480, O.W * 0.45) : 0; }
function oFitK(){ const [x0, y0, x1, y1] = O.bounds; return Math.max(0.02, Math.min((O.W - 80) / (x1 - x0), (O.H - 134) / (y1 - y0))); }
function oCamFor(x0, y0, x1, y1, pad, kCap){
  const Wf = O.W - oPanelW(), top = 64, bottom = 70; pad = pad ?? 48;
  const k = clamp(Math.min((Wf - 2 * pad) / Math.max(1, x1 - x0), (O.H - top - bottom) / Math.max(1, y1 - y0), kCap ?? Infinity), kMin(), kMax());
  return {k, x: Wf / 2 - (x0 + x1) / 2 * k, y: top + (O.H - top - bottom) / 2 - (y0 + y1) / 2 * k};
}
function oApply(){
  const {k, x, y} = O.cam;
  O.el.cam.setAttribute('transform', `translate(${x.toFixed(2)},${y.toFixed(2)}) scale(${k.toFixed(5)})`);
  const fs = 10.5 / k;
  (O.el.ringTexts || []).forEach(t => {
    t.setAttribute('font-size', fs.toFixed(2)); t.setAttribute('letter-spacing', (fs * 0.2).toFixed(2));
    t.setAttribute('dy', (-fs * 0.6).toFixed(2)); t.setAttribute('stroke-width', (3 / k).toFixed(2));
  });
  O.el.svg.classList.toggle('o-zin', k >= 0.8);
  oMiniView(); oSchedule();
}
function oFlyTo(to, ms){
  cancelAnimationFrame(O.anim);
  ms = ms ?? 700;

  const from = {...O.cam}, t0 = performance.now(), cx0 = O.W / 2, cy0 = O.H / 2;
  const fc = {x: (cx0 - from.x) / from.k, y: (cy0 - from.y) / from.k}, tc = {x: (cx0 - to.x) / to.k, y: (cy0 - to.y) / to.k};
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const k = Math.exp(Math.log(from.k) + (Math.log(to.k) - Math.log(from.k)) * e);
    const wx = fc.x + (tc.x - fc.x) * e, wy = fc.y + (tc.y - fc.y) * e;
    O.cam = {k, x: cx0 - wx * k, y: cy0 - wy * k}; oApply();

  O.anim = requestAnimationFrame(step);
}
function oZoomAt(mx, my, f, anim){
  const {k, x, y} = O.cam, k2 = clamp(k * f, kMin(), kMax());
  const cam = {k: k2, x: mx - (mx - x) * (k2 / k), y: my - (my - y) * (k2 / k)};
