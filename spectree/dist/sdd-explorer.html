}
const oZoomBy = f => oZoomAt((O.W - oPanelW()) / 2, O.H / 2, f, true);
const oFit = () => oFlyTo(oCamFor(...O.bounds, 40), 650);
function oResize(){
  const W = O.el.wrap.clientWidth, H = O.el.wrap.clientHeight;
  if (!W || !H) return;
  O.W = W; O.H = H; O.kFit = oFitK();
  if (!O.cam) O.cam = oCamFor(...O.bounds, 40);
  oApply();
}

/* ---------- minimap ---------- */
function oMiniDraw(){
  const [x0, y0, x1, y1] = O.bounds, p = 30, m = O.el.mini;
  m.setAttribute('viewBox', `${f1(x0 - p)} ${f1(y0 - p)} ${f1(x1 - x0 + 2 * p)} ${f1(y1 - y0 + 2 * p)}`);
  let h = '';
  O.systems.forEach(sys => sys.rings.forEach(r => {
    if (!r.core) h += `<circle class="m-ring${r.kind === 'spec' ? ' m-spec' : ''}" cx="${f1(sys.cx)}" cy="${f1(sys.cy)}" r="${f1(r.r)}"/>`;
    r.nodes.forEach(n => { if (n.type === 'spec' || n.type === 'core') h += `<circle cx="${f1(n.x)}" cy="${f1(n.y)}" r="${f1(n.type === 'core' ? 40 : n.size * 1.3)}" style="fill:${n.type === 'core' ? 'var(--o-accent)' : oColor(n)}"/>`; });
  }));
  m.innerHTML = h + `<rect id="omview" class="m-view" rx="24"/>`;
  oMiniView();
}
function oMiniView(){
  const r = document.getElementById('omview'); if (!r || !O.cam) return;
  const {k, x, y} = O.cam;
  r.setAttribute('x', f1(-x / k)); r.setAttribute('y', f1(-y / k));
  r.setAttribute('width', f1(O.W / k)); r.setAttribute('height', f1(O.H / k));
}

/* ---------- lineage, focus, search ---------- */
function oLineage(id){
  const lit = new Set([id]), edges = [];
  const add = (a, b) => { if (O.nodes.has(a) && O.nodes.has(b) && a !== b){ lit.add(a); lit.add(b); edges.push([a, b]); } };
  const nd = O.nodes.get(id);
  if (!nd) return {lit, edges};
  const core = (nd.sys.rings.find(r => r.core) || {nodes: []}).nodes[0];
  const spec = specById.get(id) || (nd.grp && nd.ref), doc = docById.get(id), comp = compById.get(id);
  if (spec){
    if (core) add(core.id, id);
    spec.adrs.concat(spec.docs).forEach(d => add(d, id));
    (compsBySpec.get(id) || []).forEach(c => add(id, c));
    Object.keys(spec.links).forEach(t => add(id, t));
    (incoming.get(id) || new Map()).forEach((_, f) => add(oNodeFor(f), id));
  } else if (comp){
    Object.keys(comp.specs).forEach(sid => { add(sid, id); const s = specById.get(sid); if (s) s.adrs.forEach(d => add(d, sid)); });
  } else if (doc){
    (docRefs.get(id) || []).forEach(sid => add(id, oNodeFor(sid)));
    if (nd.type === 'core') nd.sys.rings.forEach(r => { if (!['spec', 'gspec', 'code', 'test'].includes(r.kind)) r.nodes.forEach(x => lit.add(x.id)); });
  }
  crossOf(id).forEach(e => add(e.from, e.to));
  return {lit, edges};
}
function oLight(lit, edges, focusId){
  if (!O.el.svg) return;
  O.lastLight = [lit, edges, focusId];
  O.nodeEls.forEach(el => el.classList.remove('lit', 'focus'));
  O.lit = lit;
  O.el.svg.classList.toggle('o-focusing', !!lit);
  let h = '';
  if (lit){
    lit.forEach(i => { const el = O.nodeEls.get(i); if (el) el.classList.add('lit'); });
    (edges || []).forEach(([a, b]) => {
      const na = O.nodes.get(a), nb = O.nodes.get(b); if (!na || !nb) return;
      const sp = [na, nb].find(n => n.type === 'spec' || n.type === 'gspec');
      h += `<path class="o-fedge" style="--c:${sp ? oColor(sp) : 'var(--o-accent)'}" d="${oEdgePath(na, nb)}"/>`;
    });
    const f = focusId && O.nodes.get(focusId);
    if (f){
      O.nodeEls.get(focusId).classList.add('focus');
      h += `<circle class="o-ringmark" cx="${f1(f.x)}" cy="${f1(f.y)}" r="${f1(f.size + 7)}"/><circle class="o-pulse" cx="${f1(f.x)}" cy="${f1(f.y)}" r="${f1(f.size + 7)}"/>`;
    }
  }
  O.el.focus.innerHTML = h;
  oEff(); oSchedule();
}
function oSetFocus(id, fly){
  if (!O.el.svg) return;
  if (O.tour && !O.tourDriving) oTourEnd();
  if (id) id = oNodeFor(id);
  O.focus = id && O.nodes.has(id) ? id : null;
  if (!O.focus){ oLight(O.tourLit, null, null); return; }
  const {lit, edges} = oLineage(O.focus);
  oLight(lit, edges, O.focus);
  if (fly){
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    lit.forEach(i => { const n = O.nodes.get(i); if (!n) return; x0 = Math.min(x0, n.x - n.size); y0 = Math.min(y0, n.y - n.size); x1 = Math.max(x1, n.x + n.size); y1 = Math.max(y1, n.y + n.size); });
    oFlyTo(oCamFor(x0 - 90, y0 - 70, x1 + 90, y1 + 70, 30, O.kFit * 3.2), 750);
  }
}
function oSearch(){
  if (!O.el.svg) return;
  const q = state.q;
  if (!q){
    O.qset = null; O.el.svg.classList.remove('o-qactive');
    O.nodeEls.forEach(el => el.classList.remove('qhit', 'qdim'));
  } else {
    const set = new Set();
    O.nodes.forEach((nd, id) => {
      const r = nd.ref;
      const t = nd.grp ? r.members.map(specText).join(' ') : (nd.type === 'spec' || nd.type === 'gspec') ? specText(r) : (nd.type === 'code' || nd.type === 'test') ? r.path.toLowerCase() : docText(r);
      if (t.includes(q)) set.add(id);
    });
    O.qset = set; O.el.svg.classList.add('o-qactive');
    O.nodeEls.forEach((el, id) => { el.classList.toggle('qhit', set.has(id)); el.classList.toggle('qdim', !set.has(id)); });
  }
  oEff(); oSchedule();
}
function oSearchBest(){
  if (!O.qset || !O.qset.size) return null;
  const ids = [...O.qset], t = i => O.nodes.get(i).type;
  return ids.find(i => t(i) === 'spec') || ids.find(i => t(i) === 'gspec') || ids[0];
}

/* ---------- hover tooltip ---------- */
function oHover(id, ev){
  if (id === O.hover){ if (ev) oTipMove(ev); return; }
  if (O.hover) O.nodeEls.get(O.hover)?.classList.remove('hov');
  O.hover = id;
  if (id) O.nodeEls.get(id)?.classList.add('hov');
  oTip(id, ev); oEff(); oSchedule();
}
function oTip(id, ev){
  const tip = O.el.tip, nd = id && O.nodes.get(id);
  if (!nd){ tip.hidden = true; return; }
  const r = nd.ref; let h;
  if (nd.type === 'spec' || nd.type === 'gspec'){
    h = `<div class="o-tip-k">${esc(projName(r.project))} · ${nd.grp ? 'spec group' : 'spec ' + esc(r.number)}${r.area ? ' · ' + esc(r.area) : ''}</div><b>${md(r.title)}</b><div>${chip(r.status)}</div>${bar(r.counts)}
      <div class="o-tip-m">${plural(r.reqs.length, 'requirement')} · ${r.tasks.done}/${r.tasks.total} tasks${r.evidence.implemented ? ` · ${pct(r.evidence.tested, r.evidence.implemented)}% tested` : ''}${r.gaps.length ? ` · ${plural(r.gaps.length, 'open gap')}` : ''}</div>`;
  } else if (nd.type === 'code' || nd.type === 'test'){
    h = `<div class="o-tip-k">${esc(projName(r.project))} · ${esc(r.layer)}</div><b class="o-mono">${esc(r.path)}</b>
      <div class="o-tip-m">${nd.type === 'test' ? 'Cites requirements in' : 'Implements requirements in'} ${plural(Object.keys(r.specs).length, 'spec')}</div>`;
  } else {
    h = `<div class="o-tip-k">${esc(projName(r.project))} · ${esc(r.layer)}</div><b>${r.kind === 'adr' ? 'ADR ' + esc(r.number) + ': ' : ''}${md(r.title)}</b>
      ${r.status ? `<div class="o-tip-m">${esc(r.status)}</div>` : ''}${r.stats.length ? `<div class="o-tip-m">${r.stats.map(s => `${esc(s.value)} ${esc(s.label)}`).join(' · ')}</div>` : ''}`;
  }
  tip.innerHTML = h + `<div class="o-tip-h">${nd.grp ? 'Click to list its specs by area' : 'Click to trace its lineage'}</div>`;
  tip.hidden = false;
  if (ev) oTipMove(ev);
}
function oTipMove(ev){
  const tip = O.el.tip; if (tip.hidden) return;
  const r = O.el.wrap.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX - r.left + 16, y = ev.clientY - r.top + 18;
  if (x + w > O.W - 8) x = ev.clientX - r.left - w - 16;
  if (y + h > O.H - 8) y = ev.clientY - r.top - h - 16;
  tip.style.transform = `translate(${Math.max(8, x)}px,${Math.max(8, y)}px)`;
}

/* ---------- guided tour ---------- */
function oTourSteps(){
  const app = M.app_name || (M.title || '').replace(/\s*[-—]\s*SDD Spec tree$/i, '');
  const steps = [{title: `${app}: the spec tree`, fit: true,
    text: O.detail ? 'Spec-driven development drawn as an orbit. Principles sit at the core. Every ring further out must honour the rings inside it. Specs sit in the middle, code and tests near the edge, and the gates close the system.'
      : 'Read it from the centre out. The constitution is in the middle. Each ring further out must follow the rings inside it: steering, product, architecture, decisions, then the specs. The gates on the outside check all of it.'}];
  if (M.workflow_steps.length) steps.push({title: 'How a change moves', fit: true,
    html: `<ol class="o-steps">${M.workflow_steps.map(s => `<li><b>${esc(s.label)}.</b> ${md(s.text)}</li>`).join('')}</ol>`});
  const seen = [];
  O.systems.forEach(sys => sys.rings.forEach(r => { if (!seen.find(x => x.label === r.label)) seen.push(r); }));
  seen.forEach(r => steps.push({title: r.label, ring: r.label,
    text: r.core ? 'The constitution holds the non-negotiable principles. Everything else orbits it, and every gate checks against it.' : r.explain}));
  const cand = D.specs.filter(s => O.nodes.has(s.id) && !s.group)
    .sort((a, b) => (b.status === 'Gap') - (a.status === 'Gap') || (compsBySpec.get(b.id) || []).length - (compsBySpec.get(a.id) || []).length)[0];
  if (cand) steps.push({title: 'Trace one spec', focus: cand.id,
    text: `Spec ${cand.number}, ${cand.title}, traced inward to the principles and decisions behind it${O.detail ? ' and outward to the code and tests that prove it' : ''}. The coloured ring around it shows its mix of requirement statuses. The panel lists its requirements, tasks and code files.`});
  steps.push({title: 'Your turn', fit: true,
    text: `Click anything to trace it. Press ${MOD}K to find a spec, requirement or file. Switch to Detailed to also see code and test files.`});
  return steps;
}
function oRingStats(label){
  const out = [];
  O.systems.forEach(sys => sys.rings.filter(r => r.label === label).forEach(r => {
    const n = r.nodes.length; let s;
    if (r.kind === 'spec' || r.kind === 'gspec'){
      const c = {}; r.nodes.forEach(x => c[x.ref.status] = (c[x.ref.status] || 0) + 1);
      s = `${plural(n, 'spec')}: ` + ['Implemented', 'Partial', 'Gap', 'Planned', 'Unknown', 'Deprecated'].filter(k => c[k]).map(k => `${c[k]} ${k.toLowerCase()}`).join(', ');
    } else if (r.kind === 'code') s = `${plural(n, 'file')} linked to requirements`;
    else if (r.kind === 'test') s = `${plural(n, 'test file')}; ${pct(sys.p.evidence.tested, sys.p.evidence.implemented)}% of implemented requirements are cited`;
    else if (r.kind === 'adr') s = plural(n, 'decision');
    else if (r.core){ const pr = r.nodes[0].ref.stats.find(x => x.label === 'principles'); s = pr ? `${pr.value} principles` : 'the constitution'; }
    else s = plural(n, 'document');
    out.push(`<div><b>${esc(sys.p.name)}</b>${esc(s)}</div>`);
  }));
  return out.join('');
}
function oTourStart(i){ O.tour = {i: i || 0, steps: oTourSteps()}; oHintOff(); oTourShow(); }
function oTourShow(){
  const T = O.tour; if (!T || !O.el.svg) return;
  T.i = clamp(T.i, 0, T.steps.length - 1);
  const st = T.steps[T.i];
  O.el.svg.querySelectorAll('.o-ring.on,.o-ringlabel.on').forEach(e => e.classList.remove('on'));
  O.tourLit = null; O.focus = null;
  if (st.ring){
    const lit = new Set(); let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    O.systems.forEach((sys, si) => sys.rings.forEach(r => {
      if (r.label !== st.ring) return;
      r.nodes.forEach(n => lit.add(n.id));
      O.el.svg.querySelectorAll(`[data-ring="${si}|${r.index}"]`).forEach(e => e.classList.add('on'));
      const R = r.r + 90 + Math.max(...r.nodes.map(n => n.size));
      x0 = Math.min(x0, sys.cx - R); y0 = Math.min(y0, sys.cy - R); x1 = Math.max(x1, sys.cx + R); y1 = Math.max(y1, sys.cy + R);
    }));
    O.tourLit = lit; oLight(lit, null, null);
    oFlyTo(oCamFor(x0, y0, x1, y1, 30), 900);
  } else if (st.focus){
    O.tourDriving = true; oSetFocus(st.focus, true); O.tourDriving = false;
  } else { oLight(null, null, null); oFlyTo(oCamFor(...O.bounds, 40), 900); }
  const last = T.i === T.steps.length - 1;
  O.el.tour.hidden = false;
  O.el.tour.innerHTML = `<div class="o-tour-k">${T.i + 1} / ${T.steps.length}</div><h3>${esc(st.title)}</h3>
    ${st.html || `<p>${md(st.text || '')}</p>`}${st.ring ? `<div class="o-tour-stats">${oRingStats(st.ring)}</div>` : ''}
    <div class="o-tour-nav"><div class="o-dots">${T.steps.map((_, i) => `<i class="${i === T.i ? 'on' : ''}" data-tgo="${i}" title="Step ${i + 1}"></i>`).join('')}</div>
    <button class="o-btn" data-t="prev" ${T.i ? '' : 'disabled'} aria-label="Previous step">←</button>
    <button class="o-btn" data-t="play" aria-label="${O.play ? 'Pause' : 'Play'}">${O.play ? '❚❚' : '▶'}</button>
    <button class="o-btn o-primary" data-t="${last ? 'end' : 'next'}">${last ? 'Done' : 'Next →'}</button>
    <button class="o-btn o-x" data-t="end" aria-label="Close the tour">✕</button></div>`;
}
function oTourEnd(){
  clearInterval(O.play); O.play = 0; O.tour = null; O.tourLit = null;
  if (O.el.tour) O.el.tour.hidden = true;
  if (O.el.svg) O.el.svg.querySelectorAll('.o-ring.on,.o-ringlabel.on').forEach(e => e.classList.remove('on'));
  if (!O.focus) oLight(null, null, null);
}
function oTourGo(d){ if (!O.tour) return; O.tour.i += d; if (O.tour.i >= O.tour.steps.length || O.tour.i < 0){ oTourEnd(); return; } oTourShow(); }
function oTourPlay(){
  if (O.play){ clearInterval(O.play); O.play = 0; }
  else O.play = setInterval(() => {
    if (!O.tour || O.tour.i >= O.tour.steps.length - 1){ clearInterval(O.play); O.play = 0; if (O.tour) oTourShow(); return; }
    oTourGo(1);
  }, 6500);
  oTourShow();
}

/* ---------- command palette ---------- */
function oPalIndex(){
  if (O.palIdx) return O.palIdx;
  const items = [];
  D.specs.forEach(s => {
    items.push({id: s.id, k: 'Spec', t: `${s.number} ${s.title}`, sub: `${projName(s.project)}${s.group ? ' · ' + groupLabel(s.group) : ''}`, st: s.status, w: s.group ? 2 : 4});
    s.reqs.forEach(r => items.push({id: s.id, k: 'Requirement', t: `${r.id} ${r.title}`, sub: `${s.number} ${s.title}`, st: r.status, w: 1}));
  });
  D.foundation.forEach(d => items.push({id: d.id, k: d.kind === 'adr' ? 'Decision' : d.layer, t: d.kind === 'adr' ? `ADR ${d.number} ${d.title}` : d.title, sub: projName(d.project), w: 3}));
  D.components.forEach(c => items.push({id: c.id, k: c.kind === 'test' ? 'Test' : 'Code', t: c.path, sub: `${projName(c.project)} · ${c.layer}`, w: 1}));
  items.forEach(i => { i.h = (i.t + ' ' + i.k + ' ' + i.sub).toLowerCase(); i.tl = i.t.toLowerCase(); });
  return O.palIdx = items;
}
function oPalOpen(){
  const P = O.el.pal; if (!P) return;
  P.hidden = false; oHintOff();
  const inp = P.querySelector('input'); inp.value = ''; O.palSel = 0; oPalList('');
  setTimeout(() => inp.focus(), 0);
}
function oPalClose(){ if (O.el.pal) O.el.pal.hidden = true; }
function oPalList(q){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean), q0 = toks[0] || '';
  let res;
  if (!toks.length) res = oPalIndex().filter(i => i.k === 'Spec' && i.w === 4).slice(0, 12);
  else res = oPalIndex().filter(i => toks.every(t => i.h.includes(t)))
    .map(i => ({i, s: i.w + (i.tl.startsWith(q0) ? 6 : 0) + (i.tl.includes(' ' + q0) ? 2 : 0)}))
    .sort((a, b) => b.s - a.s).slice(0, 12).map(x => x.i);
  O.palRes = res; O.palSel = clamp(O.palSel, 0, Math.max(0, res.length - 1));
  O.el.pal.querySelector('.o-pal-list').innerHTML = res.length ? res.map((r, i) => `<li class="${i === O.palSel ? 'on' : ''}" data-pi="${i}" role="option" aria-selected="${i === O.palSel}">
      <i class="sw${r.st ? '' : ' o-sw-n'}" ${r.st ? `style="--c:var(--st-${r.st})"` : ''}></i><span class="o-pal-t">${md(r.t)}</span><span class="o-pal-s">${esc(r.k)} · ${esc(r.sub)}</span></li>`).join('')
    : '<li class="o-pal-empty">Nothing matches. Try an ID like 009, a requirement ID or a file name.</li>';
  const on = O.el.pal.querySelector('li.on'); if (on) on.scrollIntoView({block: 'nearest'});
}
function oPalPick(i){ const r = O.palRes[i]; if (!r) return; oPalClose(); select(r.id); }

    adr: `<polygon points="${oPoly(8, 8, 6.4, 4, 0)}" fill="var(--o-node)" stroke="var(--o-ink)"/>`,
    spec: '<circle cx="8" cy="8" r="5" fill="none" stroke="var(--st-Implemented)" stroke-width="3"/><circle cx="8" cy="8" r="5" fill="none" stroke="var(--st-Gap)" stroke-width="3" stroke-dasharray="8 40" transform="rotate(-90 8 8)"/>',
    gspec: '<circle cx="8" cy="8" r="3" fill="var(--st-Implemented)"/>',
    contract: `<polygon points="${oPoly(8, 8, 6, 6, 0)}" fill="var(--o-node)" stroke="var(--o-accent)"/>`,

  <div id="olabels" aria-hidden="true"></div>
  <div class="o-hud o-tl" id="ohud"></div>
  <div class="o-hud o-tr"><div class="o-seg o-detail" role="group" aria-label="How much to show"><button data-detail="0" aria-pressed="${!O.detail}" title="SDD layers and specs only">Simple</button><button data-detail="1" aria-pressed="${O.detail}" title="Also show every UI spec, code file and test file">Detailed</button></div><button class="o-btn o-primary" id="oTourBtn">▶ Explain SDD</button><button class="o-btn" id="oPalBtn"><kbd>${MOD}K</kbd> Find</button></div>
  <div class="o-hud o-bl" id="olens"></div>
  <div class="o-hud o-br"><div class="o-card o-mini-c"${O.detail ? '' : ' hidden'}><svg id="omini" aria-label="Overview map. Click to move there."></svg></div>
    <div class="o-card o-zoom"><button id="oZin" aria-label="Zoom in" title="Zoom in (+)">+</button><button id="oZout" aria-label="Zoom out" title="Zoom out (−)">−</button><button id="oFit" aria-label="Fit everything" title="Fit everything (0)">⤢</button></div></div>
  <div class="o-tip o-card" id="otip" hidden></div>
  <div class="o-tour o-card" id="otour" hidden role="dialog" aria-label="Guided tour"></div>
  <div class="o-hint" id="ohint" hidden>Scroll or pinch to zoom · Drag to pan · Click anything to trace it · <kbd>${MOD}K</kbd> to find · <b>▶ Explain SDD</b> for a guided tour</div>
  <div class="o-pal" id="opal" hidden><div class="o-pal-box" role="dialog" aria-label="Find">
    <input type="text" placeholder="Find a spec, requirement, decision or file…" aria-label="Find" autocomplete="off" spellcheck="false">
    <ul class="o-pal-list" role="listbox"></ul>
    <div class="o-pal-f"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> trace</span><span><kbd>esc</kbd> close</span></div></div></div>
</div>`;
}
function oHintOff(){
  const h = O.el.hint; if (!h || h.hidden || h.classList.contains('off')) return;
  h.classList.add('off'); store.set('ohint', 1);
  setTimeout(() => { h.hidden = true; }, 700);
}

/* ---------- events ---------- */
function oBind(){
  const svg = O.el.svg, ptrs = new Map();
  let drag = null, pinch = null;
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    cancelAnimationFrame(O.anim); oHintOff();
    if (ptrs.size === 2){
      const [a, b] = [...ptrs.values()];
      pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, cam: {...O.cam}, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2}; drag = null; return;
    }
    const n = e.target.closest && e.target.closest('[data-oid]');
    drag = {x: e.clientX, y: e.clientY, cam: {...O.cam}, moved: false, node: n ? n.dataset.oid : null};
  });
  svg.addEventListener('pointermove', e => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && ptrs.size === 2){
      const [a, b] = [...ptrs.values()], r = svg.getBoundingClientRect();
      const k2 = clamp(pinch.cam.k * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, kMin(), kMax());
      const mx = pinch.mx - r.left, my = pinch.my - r.top;
      O.cam = {k: k2, x: mx - (mx - pinch.cam.x) * (k2 / pinch.cam.k), y: my - (my - pinch.cam.y) * (k2 / pinch.cam.k)}; oApply(); return;
    }
    if (drag){
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 4){ drag.moved = true; svg.classList.add('o-grab'); oHover(null); }
      if (drag.moved){ O.cam = {k: drag.cam.k, x: drag.cam.x + dx, y: drag.cam.y + dy}; oApply(); }
      return;
    }
    const n = e.target.closest && e.target.closest('[data-oid]');
    oHover(n ? n.dataset.oid : null, e);
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (drag && !drag.moved){ if (drag.node) select(drag.node); else if (O.focus) closePanel(); }
    drag = null; svg.classList.remove('o-grab');
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
  svg.addEventListener('pointerleave', () => { if (!drag) oHover(null); });
  svg.addEventListener('wheel', e => {
    e.preventDefault(); cancelAnimationFrame(O.anim); oHintOff();
    const r = svg.getBoundingClientRect();
    const mouse = e.deltaMode === 1 || (Math.abs(e.deltaY) >= 50 && e.deltaX === 0 && Number.isInteger(e.deltaY));
    if (e.ctrlKey || e.metaKey || mouse) oZoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)));
    else { O.cam = {k: O.cam.k, x: O.cam.x - e.deltaX, y: O.cam.y - e.deltaY}; oApply(); }
  }, {passive: false});
  svg.addEventListener('dblclick', e => { const r = svg.getBoundingClientRect(); oZoomAt(e.clientX - r.left, e.clientY - r.top, 2.2, true); });
  O.el.wrap.querySelector('.o-detail').addEventListener('click', e => {
    const b = e.target.closest('[data-detail]'); if (!b || (b.dataset.detail === '1') === O.detail) return;
    O.detail = b.dataset.detail === '1'; store.set('odetail', O.detail); O.sig = ''; O.cam = null; orbitRender();
  });
  document.getElementById('oTourBtn').addEventListener('click', () => oTourStart(0));
  document.getElementById('oPalBtn').addEventListener('click', oPalOpen);
  document.getElementById('oZin').addEventListener('click', () => oZoomBy(1.5));
  document.getElementById('oZout').addEventListener('click', () => oZoomBy(1 / 1.5));
  document.getElementById('oFit').addEventListener('click', oFit);
  O.el.lens.addEventListener('click', e => {
    const b = e.target.closest('[data-lens]'); if (!b) return;
    O.lens = b.dataset.lens; store.set('lens', O.lens);
    oDrawNodes();
    O.cands.forEach(c => { if (c.el && c.node) c.el.style.setProperty('--c', oColor(c.node)); });
    O.el.lens.innerHTML = oLensHTML(); oMiniDraw();
    oLight(...O.lastLight); if (O.focus) O.nodeEls.get(O.focus)?.classList.add('focus');
    oSearch();
  });
  O.el.lens.addEventListener('change', e => {
    if (e.target.id !== 'oThreads') return;
    O.threads = e.target.checked; store.set('threads', O.threads);
    svg.classList.toggle('o-nothreads', !O.threads);
  });
  O.el.tour.addEventListener('click', e => {
    const g = e.target.closest('[data-tgo]'); if (g){ O.tour.i = +g.dataset.tgo; oTourShow(); return; }
    const b = e.target.closest('[data-t]'); if (!b) return;
    ({prev: () => oTourGo(-1), next: () => oTourGo(1), end: oTourEnd, play: oTourPlay})[b.dataset.t]();
  });
  const mini = O.el.mini;
  const miniMove = e => {
    const pt = mini.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const w = pt.matrixTransform(mini.getScreenCTM().inverse()), Wf = O.W - oPanelW();
    O.cam = {k: O.cam.k, x: Wf / 2 - w.x * O.cam.k, y: O.H / 2 - w.y * O.cam.k}; oApply();
  };
  mini.addEventListener('pointerdown', e => { mini.setPointerCapture(e.pointerId); O.miniDrag = true; cancelAnimationFrame(O.anim); miniMove(e); });
  mini.addEventListener('pointermove', e => { if (O.miniDrag) miniMove(e); });
  mini.addEventListener('pointerup', () => { O.miniDrag = false; });
  const P = O.el.pal, inp = P.querySelector('input');
  inp.addEventListener('input', () => { O.palSel = 0; oPalList(inp.value); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); O.palSel = clamp(O.palSel + (e.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, O.palRes.length - 1)); oPalList(inp.value); }
    else if (e.key === 'Enter'){ e.preventDefault(); oPalPick(O.palSel); }
  });
  P.addEventListener('click', e => { const li = e.target.closest('[data-pi]'); if (li) return oPalPick(+li.dataset.pi); if (e.target === P) oPalClose(); });
}

/* ---------- entry ---------- */
function orbitRender(){
  const sig = visible().map(p => p.key).join(',') + '|' + M.group_folders + '|' + O.detail;
  if (document.getElementById('orbit') && O.sig === sig){ oSearch(); return; }
  const keep = O.sig === sig && O.cam;
  O.sig = sig;
  $('#view').innerHTML = oShell();
  const g = id => document.getElementById(id);
  O.el = {wrap: g('orbit'), svg: g('osvg'), cam: g('ocam'), defs: g('odefs'), rings: g('orings'), threads: g('othreads'), xarcs: g('oxarcs'),
    focus: g('ofocus'), nodes: g('onodes'), labels: g('olabels'), tip: g('otip'), tour: g('otour'), hud: g('ohud'), lens: g('olens'),
    mini: g('omini'), pal: g('opal'), hint: g('ohint')};
  clearInterval(O.play); O.play = 0; O.tour = null; O.tourLit = null; O.hover = null; O.focus = null; O.lastLight = [null, null, null];
  oLayout(); oDrawStatic(); oDrawNodes(); oCands();
  O.el.hud.innerHTML = O.detail ? oHudHTML() : '';
  O.el.lens.innerHTML = oLensHTML();
  O.el.svg.classList.toggle('o-nothreads', !O.threads);
  oBind();
  O.W = O.el.wrap.clientWidth; O.H = O.el.wrap.clientHeight; O.kFit = oFitK();
  O.cam = keep ? O.cam : oCamFor(...O.bounds, 40);
  oMiniDraw(); oApply(); oSearch();
  if (state.selected && O.nodes.has(state.selected)) oSetFocus(state.selected, false);
  if (!store.get('ohint', 0)){ O.el.hint.hidden = false; setTimeout(oHintOff, 9000); }
}
document.addEventListener('keydown', ev => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName || '');
  const live = isOrbit() && state.tab === 'flow' && O.el.wrap && document.body.contains(O.el.wrap);
  if ((ev.metaKey || ev.ctrlKey) && (ev.key || '').toLowerCase() === 'k'){
    ev.preventDefault(); ev.stopImmediatePropagation();
    if (live) oPalOpen(); else $('#search').focus();
    return;
  }
  if (!live) return;
  if (ev.key === 'Escape'){
    if (!O.el.pal.hidden){ oPalClose(); ev.stopImmediatePropagation(); return; }
    if (O.tour){ oTourEnd(); ev.stopImmediatePropagation(); return; }
    if (O.focus && !$('#panel').classList.contains('open')){ oSetFocus(null); ev.stopImmediatePropagation(); }
    return;
  }
  if (ev.target.id === 'search' && ev.key === 'Enter'){ const b = oSearchBest(); if (b){ ev.preventDefault(); select(b); } return; }
  if (typing) return;
  if (ev.key === '/'){ ev.preventDefault(); ev.stopImmediatePropagation(); oPalOpen(); return; }
  if (O.tour && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')){ ev.preventDefault(); oTourGo(ev.key === 'ArrowRight' ? 1 : -1); return; }
  if (ev.key === '+' || ev.key === '='){ oZoomBy(1.5); }
  else if (ev.key === '-' || ev.key === '_'){ oZoomBy(1 / 1.5); }
  else if (ev.key === '0'){ oFit(); }
}, true);

/* ---------- render + events ---------- */
function render(){
  document.body.classList.toggle('o-full', isOrbit() && state.tab === 'flow');
  renderHeader();
  if (state.tab === 'flow') renderFlow();
  else if (state.tab === 'components') renderComponents();
  else renderStatus();
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-tabjump],[data-group],[data-node],[data-open],[data-cnode],[data-collapse],[data-cmpview],#pn-close,#backdrop,#theme,#design');
  if (!t) return;
  if (t.id === 'pn-close' || t.id === 'backdrop') return closePanel();
  if (t.id === 'design'){ const next = DESIGNS_UI[(DESIGNS_UI.indexOf(root.dataset.design) + 1) % DESIGNS_UI.length]; store.set('design', next); applyDesign(next); return; }
  if (t.id === 'theme'){
    const order = ['auto', 'light', 'dark']; const cur = store.get('theme', 'auto');
    const next = order[(order.indexOf(cur) + 1) % 3]; store.set('theme', next); applyTheme(next); return;
  }
  if (t.dataset.tab || t.dataset.tabjump){ state.tab = t.dataset.tab || t.dataset.tabjump; store.set('tab', state.tab); try { history.replaceState(null, '', '#' + state.tab); } catch(e){} render(); window.scrollTo(0, 0); return; }
  if (t.dataset.group){
    const k = t.dataset.group;
    state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
    store.set('expanded', [...state.expanded]); renderFlow(); return;
  }
  if (t.dataset.collapse){
    const k = t.dataset.collapse;
    state.cmpCollapsed.has(k) ? state.cmpCollapsed.delete(k) : state.cmpCollapsed.add(k);
    store.set('cmpCollapsed', [...state.cmpCollapsed]); renderComponents(); return;
  }
  if (t.dataset.cmpview){ state.cmpView = t.dataset.cmpview; store.set('cmpView', state.cmpView); renderComponents(); return; }
  const id = t.dataset.node || t.dataset.open || t.dataset.cnode;
  if (id){
    if (t.dataset.open && state.tab === 'flow'){
      const s = specById.get(id);
      if (s && s.group && !state.expanded.has(s.project + '|' + s.group)){ state.expanded.add(s.project + '|' + s.group); renderFlow(); }
    }
    select(id);
    if (t.dataset.open && state.tab === 'flow'){ const el = nodeEl(id); if (el) el.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.proj){
    if (!t.checked && state.projects.size === 1){ t.checked = true; return; }
    t.checked ? state.projects.add(t.dataset.proj) : state.projects.delete(t.dataset.proj);
    render(); return;
  }
  if (t.id === 'cmpTests'){ state.cmpTests = t.checked; store.set('cmpTests', t.checked); renderComponents(); }
  if (t.id === 'cmpUI'){ state.cmpExpandUI = t.checked; store.set('cmpExpandUI', t.checked); renderComponents(); }
});
document.addEventListener('mouseover', ev => {
  if (state.tab !== 'components') return;
  const r = ev.target.closest('#view .cv [data-cnode]');
  traceComponents(r ? r.dataset.cnode : state.selected);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closePanel();
  if (ev.key === 'Enter' && ev.target.matches('.row[data-cnode]')) select(ev.target.dataset.cnode);
  if (ev.key === '/' && document.activeElement !== $('#search')){ ev.preventDefault(); $('#search').focus(); }
});
let qt;
$('#search').addEventListener('input', ev => {
  clearTimeout(qt);
  qt = setTimeout(() => { state.q = ev.target.value.trim().toLowerCase(); render(); }, 140);
});
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { renderHeader(); if (isOrbit() && state.tab === 'flow' && O.el.wrap && document.body.contains(O.el.wrap)) oResize(); else if (state.tab === 'flow') drawCross(); if (state.tab === 'components') drawEdges(); }, 120);
});
function applyTheme(t){
  if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  $('#theme').textContent = t === 'light' ? '☀' : t === 'dark' ? '☾' : '◐';
  $('#theme').title = 'Theme: ' + t;
}
const DESIGNS_UI = ['classic', 'glass', 'orbit'];
const DESIGN_LABEL = {classic: '◇ Classic', glass: '◆ Glass', orbit: '◉ Orbit'};
function applyDesign(d, boot){
  if (!DESIGNS_UI.includes(d)) d = 'glass';
  const prev = root.dataset.design;
  root.setAttribute('data-design', d);
  $('#design').textContent = DESIGN_LABEL[d];
  $('#design').title = 'Design: ' + d + '. Click for the next design.';
  if (boot) return;
  if ((prev === 'orbit') !== (d === 'orbit')){ render(); return; }
  requestAnimationFrame(() => { renderHeader(); if (state.tab === 'flow') drawCross(); if (state.tab === 'components') drawEdges(); });
}
const hashDesign = hashParams.get('design');
applyDesign(DESIGNS_UI.includes(hashDesign) ? hashDesign : store.get('design', M.design || 'glass'), true);
if (['status', 'evidence', 'tasks'].includes(hashParams.get('lens'))) O.lens = hashParams.get('lens');
applyTheme(store.get('theme', 'auto'));
render();
const hashOpen = hashParams.get('open');
if (hashOpen){
  const s0 = specById.get(hashOpen);
  if (s0 && s0.group && state.tab === 'flow'){ state.expanded.add(s0.project + '|' + s0.group); renderFlow(); }
  requestAnimationFrame(() => select(hashOpen));
}
const hashTour = hashParams.get('tour');
if (hashTour !== null && isOrbit() && state.tab === 'flow') requestAnimationFrame(() => oTourStart(parseInt(hashTour, 10) || 0));
})();
</script>
</body>
</html>
